<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工服裝尺寸登記系統 - 多項目版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .hide { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        /* 統計表格專用樣式 */
        .stats-table th, .stats-table td {
            border: 1px solid #e2e8f0;
            white-space: nowrap;

</head>
<body class="bg-slate-100 min-h-screen">

                <i data-lucide="layout-list" size="48"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 mb-3">大量管理部 尺寸登記系統</h1>

                <input type="file" id="file-input-initial" accept=".xlsx, .xls" class="hidden">

                    <i data-lucide="file-down"></i> 下載名單範例檔
                </button>
            </div>

    </div>

                    <button onclick="switchTab('summary')" id="tab-btn-summary" class="flex-1 py-2 rounded-lg flex items-center justify-center gap-2 text-xs font-bold transition">
                        <i data-lucide="bar-chart-3" size="14"></i> 總統計表
                    </button>
                </div>
                <button onclick="switchTab('manage')" id="tab-btn-manage" class="w-full py-2 rounded-xl flex items-center justify-center gap-2 text-xs font-bold transition border border-slate-200 bg-white text-slate-600 hover:bg-slate-50">
                    <i data-lucide="settings" size="14"></i> 專案與人員管理

            </div>

            <div id="unit-list-wrapper" class="flex-1 flex flex-col overflow-hidden">

        <main class="flex-1 overflow-hidden flex flex-col h-full bg-slate-50">
            
            <div id="view-list" class="flex-1 flex flex-col h-full overflow-hidden">
                <div class="bg-white p-4 lg:p-6 shadow-sm border-b border-slate-200">
                    <div class="flex flex-col gap-4">
                        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">

                                <div class="flex items-center gap-4 mt-1 text-sm text-slate-500 font-medium">

                                    <span id="unit-complete-badge" class="hide text-emerald-600 flex items-center gap-1 bg-emerald-50 px-2 py-0.5 rounded-full"><i data-lucide="check-circle-2" size="14"></i> 單位全完成</span>
                                </div>
                            </div>
                            <div class="relative w-full lg:w-72">
                                <i data-lucide="search" size="18" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="search-input" placeholder="搜尋姓名..." oninput="renderEmployeeList()" class="w-full pl-10 pr-4 py-2 bg-slate-100 border-2 border-transparent rounded-xl focus:bg-white focus:border-indigo-500 outline-none transition">
                            </div>

                                            <th class="px-4 py-2 text-right bg-slate-50/50">小計</th>

                <div class="flex-1 overflow-y-auto p-4 lg:p-6 custom-scrollbar">
                    <div id="employee-cards-container" class="max-w-4xl mx-auto space-y-3"></div>
                </div>
            </div>

            <div id="view-summary" class="flex-1 overflow-y-auto bg-slate-50 p-6 md:p-10 custom-scrollbar hide">
                <div class="max-w-5xl mx-auto">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                        <div>
                            <h2 class="text-3xl font-black text-slate-800">全公司尺寸總計</h2>
                            <p class="text-slate-400 font-medium">統計所有已完成登記的人員數據</p>
                        </div>
                        <button onclick="exportResults()" class="flex items-center gap-2 bg-emerald-600 text-white py-3 px-6 rounded-2xl hover:bg-emerald-700 transition font-bold shadow-lg active:scale-95">
                            <i data-lucide="download"></i> 匯出報表 (XLSX)
                        </button>
                    </div>

                    <div class="mb-6 flex items-center gap-3 p-4 bg-white rounded-2xl border border-slate-200">
                        <span class="font-bold text-slate-600">檢視項目：</span>
                        <div id="summary-item-tabs" class="flex flex-wrap gap-2"></div>
                    </div>

                    <div id="global-summary-grid" class="mb-10"></div>
                    
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-6 bg-slate-800 text-white font-bold flex justify-between">
                            <span>各單位進度總覽</span>

                    </div>

            <div id="view-manage" class="flex-1 overflow-y-auto bg-slate-50 p-6 md:p-10 custom-scrollbar hide">

                    <h2 class="text-3xl font-black text-slate-800 mb-2">管理中心</h2>
                    
                    <section class="mb-10">
                        <div class="flex items-center gap-2 mb-4">
                            <div class="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center"><i data-lucide="check-square" size="18"></i></div>
                            <h3 class="text-xl font-bold text-slate-800">1. 設定本次登記項目</h3>
                        </div>
                        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                            <p class="text-sm text-slate-400 mb-4">請勾選本次需要員工填寫的衣物種類，員工將會看到對應的選擇區塊。</p>
                            <div id="project-items-config" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                            </div>
                            <div class="flex gap-2">
                                <input type="text" id="new-item-name" placeholder="新增自定義項目 (如: 工作長褲)" class="flex-1 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                                <button onclick="addNewProjectItem()" class="bg-slate-800 text-white px-6 py-2 rounded-xl font-bold hover:bg-slate-900 transition">新增</button>
                            </div>
                        </div>
                    </section>

                    <section class="mb-10">
                        <div class="flex items-center gap-2 mb-4">
                            <div class="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center"><i data-lucide="users" size="18"></i></div>
                            <h3 class="text-xl font-bold text-slate-800">2. 人員異動管理</h3>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i data-lucide="user-plus" size="18"></i> 手動新增</h3>
                                <div class="space-y-3">
                                    <input type="text" id="manual-name" placeholder="姓名" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                                    <input type="text" id="manual-unit" placeholder="單位" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                                    <button onclick="manualAddEmployee()" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold hover:bg-indigo-700 transition">確認新增</button>
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-3xl border border-indigo-100 bg-indigo-50/30 shadow-sm flex flex-col justify-center items-center text-center">
                                <i data-lucide="refresh-cw" size="32" class="text-indigo-500 mb-3"></i>
                                <h3 class="font-bold text-slate-700 mb-2">增量匯入名單</h3>
                                <p class="text-xs text-slate-500 mb-4">補充新名單，不影響現有尺寸紀錄</p>
                                <input type="file" id="file-input-incremental" accept=".xlsx, .xls" class="hidden">
                                <button onclick="document.getElementById('file-input-incremental').click()" class="bg-white border-2 border-indigo-200 text-indigo-600 px-6 py-2 rounded-xl font-bold hover:bg-indigo-50 transition">選擇檔案</button>
                            </div>
                        </div>

                        <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                <h3 class="font-bold text-slate-800">名單總覽 (<span id="manage-total-count">0</span>)</h3>
                                <div class="relative w-48">
                                    <i data-lucide="search" size="14" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                    <input type="text" id="manage-search" oninput="renderManageList()" placeholder="搜尋..." class="w-full pl-8 pr-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 transition">
                                </div>
                            </div>
                            <div id="manage-employee-list" class="divide-y divide-slate-100 max-h-[400px] overflow-y-auto custom-scrollbar"></div>
                        </div>
                    </section>
                </div>
            </div>

    <div id="custom-confirm-modal" class="fixed inset-0 bg-slate-900/50 z-[100] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 transform scale-95 transition-transform duration-300" id="custom-confirm-box">
            <div id="confirm-icon-container" class="w-14 h-14 rounded-full flex items-center justify-center mb-5 mx-auto">
                <i data-lucide="alert-triangle" size="28" id="confirm-icon"></i>
            </div>
            <h3 id="confirm-title" class="text-xl font-black text-center text-slate-800 mb-2">確認操作</h3>
            <p id="confirm-message" class="text-slate-500 text-sm text-center mb-8 font-medium"></p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition">取消</button>
                <button id="confirm-action-btn" class="flex-1 py-3 text-white font-bold rounded-xl transition shadow-lg">確定</button>
            </div>
        </div>
    </div>

    <div id="password-modal" class="fixed inset-0 bg-slate-900/50 z-[110] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 transform scale-95 transition-transform duration-300" id="password-box">
            <h3 class="text-xl font-black text-center text-slate-800 mb-2">管理員驗證</h3>
            <p class="text-slate-500 text-sm text-center mb-6 font-medium">請輸入管理密碼 (預設: admin)</p>
            <input type="password" id="admin-password-input" placeholder="密碼" onkeyup="if(event.key === 'Enter') verifyPassword()" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 mb-6 text-center tracking-widest font-bold">
            <div class="flex gap-3">
                <button onclick="closePasswordModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition">取消</button>
                <button onclick="verifyPassword()" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition shadow-lg">登入</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4xB2mpR2pUZBMjyTFjX4NVoZw1unotlE",
            authDomain: "ghgtl-5f69d.firebaseapp.com",
            projectId: "ghgtl-5f69d",
            storageBucket: "ghgtl-5f69d.firebasestorage.app",
            messagingSenderId: "528274392886",
            appId: "1:528274392886:web:6c6475a0621f497a26d597",
            measurementId: "G-W22Y07F9LJ"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        
        // 資料庫路徑設定
        const dataDocRef = doc(db, 'clothingApp_multiItem', 'mainData');

        const SIZES = ['S', 'M', 'L', 'XL', '2L', '3L', '4L', '5L', '6L'];
        const DEFAULT_ITEMS = ['短袖', '長袖', '背心', '外套'];
        
        // 核心狀態
        let employees = [];
        let config = {
            activeItems: ['短袖'], // 目前正在登記的項目
            allItems: [...DEFAULT_ITEMS] // 系統已知的所有可選項目
        };
        let selectedUnit = null;
        let activeTab = 'list';
        let summaryActiveItem = null;
        let isMobileMenuOpen = false;
        let isAdmin = sessionStorage.getItem('clothingAdmin') === 'true';
        let confirmActionCallback = null;

        window.onload = () => {
            loadAllData();
            setupFiles();
            updateAdminUI();
            lucide.createIcons();
            
            // 綁定確認按鈕事件
            document.getElementById('confirm-action-btn').onclick = () => { 
                if (confirmActionCallback) confirmActionCallback(); 
                closeConfirmModal(); 
            };
        };

        function setupFiles() {
            document.getElementById('file-input-initial').addEventListener('change', (e) => handleFile(e, true));
            document.getElementById('file-input-incremental').addEventListener('change', (e) => handleFile(e, false));
        }

        // --- Firebase 連線取代 localStorage ---
        function loadAllData() {
            onSnapshot(dataDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    employees = data.employees || [];
                    config = data.config || { activeItems: ['短袖'], allItems: [...DEFAULT_ITEMS] };
                    
                    if (employees.length > 0) {
                        if (!selectedUnit || !employees.some(e => e.unit === selectedUnit)) {
                            selectedUnit = employees[0].unit;
                        }
                        if (!summaryActiveItem && config.activeItems.length > 0) {
                            summaryActiveItem = config.activeItems[0];
                        }
                        showMainApp();
                        renderAll();
                    } else {
                        document.getElementById('welcome-screen').classList.remove('hide');
                        document.getElementById('main-app').classList.add('hide');
                    }
                } else {
                    console.log("資料庫尚未建立，等待第一次匯入資料...");
                }
            }, (error) => {
                console.error("Firebase 連線發生錯誤:", error);
            });
        }

        async function saveAllData() {
            try {
                await setDoc(dataDocRef, { employees, config });
            } catch (error) {
                console.error("Firebase 儲存失敗:", error);
                alert("儲存失敗，請檢查網路連線狀態！");
            }
        }

        function saveAndRefresh() {
            saveAllData();
            renderAll(); // 在 Firebase 尚未同步前先更新本地 UI 體驗較佳
        }
        // ------------------------------------

        function handleFile(e, isInitial) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                
                if (isInitial) employees = [];
                const startIndex = (data[0] && (data[0][0] === '單位' || data[0][1] === '姓名')) ? 1 : 0;
                
                data.slice(startIndex).forEach((row, i) => {
                    if (row && row[0] && row[1]) {
                        const unit = String(row[0]).trim();
                        const name = String(row[1]).trim();
                        if (!employees.find(e => e.unit === unit && e.name === name)) {
                            employees.push({
                                id: `emp_${Date.now()}_${i}`,
                                unit, name, gender: null, sizes: {}
                            });
                        }
                    }
                });
                
                if (isInitial) {
                    isAdmin = true;
                    sessionStorage.setItem('clothingAdmin', 'true');
                    updateAdminUI();
                }

                if (!selectedUnit && employees.length > 0) selectedUnit = employees[0].unit;
                if (!summaryActiveItem && config.activeItems.length > 0) summaryActiveItem = config.activeItems[0];
                
                saveAllData();
                showMainApp();
                renderAll();
            };
            reader.readAsBinaryString(file);
            e.target.value = '';
        }

        function showMainApp() {
            document.getElementById('welcome-screen').classList.add('hide');
            document.getElementById('main-app').classList.remove('hide');
        }

        function renderAll() {
            renderSidebar();
            renderEmployeeList();
            renderSummary();
            renderManageView();
            updateGlobalProgress();
            lucide.createIcons();
        }

        function renderSidebar() {
            const container = document.getElementById('unit-list-container');
            const units = [...new Set(employees.map(e => e.unit))].sort();
            
            container.innerHTML = units.map(u => {
                const unitEmps = employees.filter(e => e.unit === u);
                const totalNeeded = unitEmps.length * config.activeItems.length;
                let currentDone = 0;
                unitEmps.forEach(e => {
                    if (e.gender) {
                        config.activeItems.forEach(item => { if (e.sizes[item]) currentDone++; });
                    }
                });
                const isComplete = totalNeeded > 0 && currentDone === totalNeeded;
                
                return `
                    <button onclick="selectUnit('${u}')" class="w-full flex items-center p-3 rounded-xl transition-all text-left border ${selectedUnit === u ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-slate-700 border-transparent hover:border-slate-200'}">
                        <div class="flex-1">
                            <div class="font-bold text-sm">${u}</div>
                            <div class="text-[10px] ${selectedUnit === u ? 'text-indigo-100' : 'text-slate-400'}">人數: ${unitEmps.length}</div>
                        </div>
                        ${isComplete ? `<i data-lucide="check-circle-2" class="w-4 h-4 ${selectedUnit === u ? 'text-indigo-200' : 'text-emerald-500'}"></i>` : ''}
                    </button>
                `;
            }).join('');
        }

        function renderEmployeeList() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('employee-cards-container');
            const unitEmps = employees.filter(e => e.unit === selectedUnit);
            const filtered = unitEmps.filter(e => e.name.toLowerCase().includes(query));

            document.getElementById('current-unit-name').innerText = selectedUnit || "未選擇";
            document.getElementById('unit-count').innerText = unitEmps.length;

            // 單位實時統計項目選擇器
            const select = document.getElementById('unit-stats-item-select');
            const oldVal = select.value;
            select.innerHTML = config.activeItems.map(item => `<option value="${item}" ${oldVal === item ? 'selected' : ''}>${item}</option>`).join('');
            const currentStatItem = select.value || config.activeItems[0];

            // 統計計算
            const stats = { '男': { t: {}, total: 0 }, '女': { t: {}, total: 0 } };
            SIZES.forEach(s => { stats['男'].t[s] = 0; stats['女'].t[s] = 0; });
            unitEmps.forEach(e => {
                if (e.gender && e.sizes[currentStatItem]) {
                    stats[e.gender].t[e.sizes[currentStatItem]]++;
                    stats[e.gender].total++;
                }
            });
            
            document.getElementById('unit-stats-tbody').innerHTML = ['男', '女'].map(g => `
                <tr>
                    <td class="px-4 py-2 font-bold ${g==='男'?'text-blue-600 bg-blue-50/30':'text-pink-600 bg-pink-50/30'}">${g}生</td>
                    ${SIZES.map(s => `<td class="px-2 py-2 text-center ${stats[g].t[s]>0?'font-black text-slate-800':'text-slate-300'}">${stats[g].t[s]}</td>`).join('')}
                    <td class="px-4 py-2 text-right font-black bg-slate-50/50">${stats[g].total}</td>
                </tr>
            `).join('');

            // 卡片生成
            container.innerHTML = filtered.map(emp => {
                const isEmpComplete = emp.gender && config.activeItems.every(item => emp.sizes[item]);
                return `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col gap-4 ${isEmpComplete ? 'border-slate-200 opacity-90' : 'border-indigo-100 ring-2 ring-indigo-50'}">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-white ${isEmpComplete ? 'bg-slate-300' : 'bg-indigo-500'}">${emp.name.charAt(0)}</div>
                                <div class="font-bold text-lg text-slate-800">${emp.name}</div>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="updateGender('${emp.id}', '男')" class="px-4 py-1.5 rounded-lg text-xs font-black transition-all border ${emp.gender === '男' ? 'bg-blue-500 text-white border-blue-500' : 'bg-white text-slate-400 border-slate-200'}">男</button>
                                <button onclick="updateGender('${emp.id}', '女')" class="px-4 py-1.5 rounded-lg text-xs font-black transition-all border ${emp.gender === '女' ? 'bg-pink-500 text-white border-pink-500' : 'bg-white text-slate-400 border-slate-200'}">女</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 gap-4">
                            ${config.activeItems.map(item => `
                                <div class="flex flex-col md:flex-row md:items-center gap-2">
                                    <div class="w-20 text-xs font-black text-slate-500 shrink-0">${item}</div>
                                    <div class="flex flex-wrap gap-1">
                                        ${SIZES.map(sz => `
                                            <button onclick="updateSize('${emp.id}', '${item}', '${sz}')" class="min-w-[40px] px-2 py-1.5 rounded-lg text-xs font-black transition-all border ${emp.sizes[item] === sz ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-500 border-transparent hover:border-slate-200'}">${sz}</button>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function renderManageView() {
            const configContainer = document.getElementById('project-items-config');
            configContainer.innerHTML = config.allItems.map(item => `
                <label class="flex items-center gap-2 p-3 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-100 transition">
                    <input type="checkbox" onchange="toggleProjectItem('${item}')" ${config.activeItems.includes(item) ? 'checked' : ''} class="w-5 h-5 accent-indigo-600">
                    <span class="font-bold text-slate-700 text-sm">${item}</span>
                </label>
            `).join('');
            renderManageList();
        }

        function renderManageList() {
            const filter = document.getElementById('manage-search').value.toLowerCase();
            const container = document.getElementById('manage-employee-list');
            const filtered = employees.filter(e => e.name.toLowerCase().includes(filter) || e.unit.toLowerCase().includes(filter)).sort((a,b) => a.unit.localeCompare(b.unit));
            
            document.getElementById('manage-total-count').innerText = employees.length;
            container.innerHTML = filtered.map(emp => `
                <div class="p-4 flex items-center justify-between hover:bg-slate-50">
                    <div class="flex items-center gap-3">
                        <span class="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-1 rounded">${emp.unit}</span>
                        <span class="font-bold text-slate-800">${emp.name}</span>
                    </div>
                    <button onclick="removeEmployee('${emp.id}')" class="p-2 text-slate-300 hover:text-red-500"><i data-lucide="trash-2" size="18"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderSummary() {
            const tabsContainer = document.getElementById('summary-item-tabs');
            if (!summaryActiveItem && config.activeItems.length > 0) summaryActiveItem = config.activeItems[0];
            
            tabsContainer.innerHTML = config.activeItems.map(item => `
                <button onclick="setSummaryItem('${item}')" class="px-4 py-2 rounded-xl text-sm font-bold transition ${summaryActiveItem === item ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}">${item}</button>
            `).join('');

            document.getElementById('summary-current-item-label').innerText = `目前檢視：${summaryActiveItem || '無'}`;
            if (!summaryActiveItem) return;

            const m = {}, f = {};
            SIZES.forEach(s => { m[s] = 0; f[s] = 0; });
            employees.forEach(e => {
                if (e.gender === '男' && e.sizes[summaryActiveItem]) m[e.sizes[summaryActiveItem]]++;
                if (e.gender === '女' && e.sizes[summaryActiveItem]) f[e.sizes[summaryActiveItem]]++;
            });

            document.getElementById('global-summary-grid').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-3xl border border-blue-100 shadow-sm">
                        <div class="flex items-center gap-2 mb-4 text-blue-600 font-bold"><i data-lucide="user" size="20"></i> 男生 (${summaryActiveItem}) 總計</div>
                        <div class="grid grid-cols-3 gap-3">
                            ${SIZES.map(s => `<div class="bg-blue-50/50 p-3 rounded-2xl text-center"><div class="text-blue-400 text-[10px] font-bold mb-1">${s}</div><div class="text-2xl font-black text-blue-700">${m[s]}</div></div>`).join('')}
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-pink-100 shadow-sm">
                        <div class="flex items-center gap-2 mb-4 text-pink-600 font-bold"><i data-lucide="user" size="20"></i> 女生 (${summaryActiveItem}) 總計</div>
                        <div class="grid grid-cols-3 gap-3">
                            ${SIZES.map(s => `<div class="bg-pink-50/50 p-3 rounded-2xl text-center"><div class="text-pink-400 text-[10px] font-bold mb-1">${s}</div><div class="text-2xl font-black text-pink-700">${f[s]}</div></div>`).join('')}
                        </div>
                    </div>
                </div>
            `;

            const units = [...new Set(employees.map(e => e.unit))].sort();
            document.getElementById('unit-summary-list').innerHTML = units.map(u => {
                const unitEmps = employees.filter(e => e.unit === u);
                const comp = unitEmps.filter(e => e.gender && e.sizes[summaryActiveItem]).length;
                return `
                    <div class="p-5 flex items-center justify-between">
                        <span class="font-bold text-slate-700">${u}</span>
                        <div class="flex items-center gap-4">
                            <div class="w-32 bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                <div class="bg-indigo-500 h-full" style="width: ${(comp/unitEmps.length)*100}%"></div>
                            </div>
                            <span class="text-sm font-black text-slate-800 w-12 text-right">${comp}/${unitEmps.length}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- 互動行為函數 ---
        function updateGender(id, g) {
            const emp = employees.find(e => e.id === id);
            if (emp) emp.gender = emp.gender === g ? null : g;
            saveAndRefresh();
        }

        function updateSize(id, item, sz) {
            const emp = employees.find(e => e.id === id);
            if (emp) {
                if (emp.sizes[item] === sz) delete emp.sizes[item];
                else emp.sizes[item] = sz;
            }
            saveAndRefresh();
        }

        function toggleProjectItem(item) {
            if (config.activeItems.includes(item)) {
                if (config.activeItems.length === 1) {
                    alert('至少必須保留一個登記項目');
                    renderManageView();
                    return;
                }
                config.activeItems = config.activeItems.filter(i => i !== item);
            } else {
                config.activeItems.push(item);
            }
            saveAndRefresh();
        }

        function addNewProjectItem() {
            const val = document.getElementById('new-item-name').value.trim();
            if (!val) return;
            if (!config.allItems.includes(val)) {
                config.allItems.push(val);
                config.activeItems.push(val);
                document.getElementById('new-item-name').value = '';
                saveAndRefresh();
            }
        }

        function setSummaryItem(item) {
            summaryActiveItem = item;
            renderSummary();
        }

        function updateGlobalProgress() {
            let totalSlots = employees.length * config.activeItems.length;
            let doneSlots = 0;
            employees.forEach(e => {
                if (e.gender) {
                    config.activeItems.forEach(item => { if (e.sizes[item]) doneSlots++; });
                }
            });
            const rate = totalSlots === 0 ? 0 : Math.round((doneSlots / totalSlots) * 100);
            document.getElementById('total-progress-bar').style.width = rate + '%';
            document.getElementById('total-progress-text').innerText = `${doneSlots} / ${totalSlots}`;
        }

        function selectUnit(u) {
            selectedUnit = u;
            if (isMobileMenuOpen) toggleMobileMenu();
            renderAll();
        }

        function toggleMobileMenu() {
            isMobileMenuOpen = !isMobileMenuOpen;
            document.getElementById('sidebar').style.transform = isMobileMenuOpen ? 'translateX(0)' : 'translateX(-100%)';
            document.getElementById('menu-icon').setAttribute('data-lucide', isMobileMenuOpen ? 'x' : 'menu');
            lucide.createIcons();
        }

        // --- 管理與系統功能 ---
        function removeEmployee(id) {
            const emp = employees.find(e => e.id === id);
            if (emp) {
                showConfirmModal('移除人員', `確定移除「${emp.name}」嗎？`, '確定移除', 'bg-red-600', 'bg-red-50 text-red-500', () => {
                    employees = employees.filter(e => e.id !== id);
                    saveAndRefresh();
                });
            }
        }

        function manualAddEmployee() {
            const n = document.getElementById('manual-name').value.trim();
            const u = document.getElementById('manual-unit').value.trim();
            if (!n || !u) return;
            employees.push({ id: `man_${Date.now()}`, unit: u, name: n, gender: null, sizes: {} });
            document.getElementById('manual-name').value = '';
            saveAndRefresh();
        }

        function showConfirmModal(title, message, btnText, btnClass, iconClass, cb) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            const btn = document.getElementById('confirm-action-btn');
            btn.innerText = btnText;
            btn.className = `flex-1 py-3 text-white font-bold rounded-xl transition shadow-lg ${btnClass}`;
            document.getElementById('confirm-icon-container').className = `w-14 h-14 rounded-full flex items-center justify-center mb-5 mx-auto ${iconClass}`;
            confirmActionCallback = cb;
            document.getElementById('custom-confirm-modal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('custom-confirm-box').classList.remove('scale-95');
        }

        function closeConfirmModal() {
            document.getElementById('custom-confirm-modal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('custom-confirm-box').classList.add('scale-95');
        }

        function closePasswordModal() {
            document.getElementById('password-modal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('password-box').classList.add('scale-95');
        }

        function goHomeAndClear() {
            showConfirmModal('重新開始', '這將會清空所有登記資料與設定，確定嗎？', '確定清空', 'bg-red-600', 'bg-red-50 text-red-500', async () => {
                try {
                    await setDoc(dataDocRef, { employees: [], config: { activeItems: ['短袖'], allItems: [...DEFAULT_ITEMS] } });
                    window.location.reload();
                } catch(error) {
                    console.error("清除錯誤", error);
                }
            });
        }

        function verifyPassword() {
            const pwd = document.getElementById('admin-password-input').value;
            if (pwd === 'admin') {
                isAdmin = true;
                sessionStorage.setItem('clothingAdmin', 'true');
                closePasswordModal();
                updateAdminUI();
                renderAll();
            } else {
                alert('密碼錯誤');
            }
        }

        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                sessionStorage.removeItem('clothingAdmin');
                if (activeTab !== 'list') switchTab('list');
                updateAdminUI();
                renderAll();
            } else {
                document.getElementById('admin-password-input').value = '';
                document.getElementById('password-modal').classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('password-box').classList.remove('scale-95');
            }
        }

        function updateAdminUI() {
            document.getElementById('tab-btn-summary').classList.toggle('hide', !isAdmin);
            document.getElementById('tab-btn-manage').classList.toggle('hide', !isAdmin);
            document.getElementById('btn-restart-sys').classList.toggle('hide', !isAdmin);
            document.getElementById('btn-admin-toggle').innerHTML = isAdmin ? '<i data-lucide="lock" size="18"></i> 退出管理' : '<i data-lucide="unlock" size="18"></i> 管理員登入';
            lucide.createIcons();
        }

        function switchTab(tab) {
            if (!isAdmin && tab !== 'list') return;
            activeTab = tab;
            ['list', 'summary', 'manage'].forEach(t => {
                document.getElementById(`view-${t}`).classList.toggle('hide', t !== tab);
                const btn = document.getElementById(`tab-btn-${t}`);
                if (btn) {
                    if (t === 'manage') {
                        btn.className = tab === 'manage' ? 'w-full py-2 rounded-xl flex items-center justify-center gap-2 text-xs font-bold transition border border-indigo-200 bg-indigo-50 text-indigo-700' : 'w-full py-2 rounded-xl flex items-center justify-center gap-2 text-xs font-bold transition border border-slate-200 bg-white text-slate-600 hover:bg-slate-50';
                    } else {
                        btn.className = tab === t ? 'flex-1 py-2 rounded-lg flex items-center justify-center gap-2 text-xs font-bold transition bg-indigo-600 text-white shadow-inner' : 'flex-1 py-2 rounded-lg flex items-center justify-center gap-2 text-xs font-bold transition text-slate-500 hover:bg-slate-50';
                    }
                }
            });
            renderAll();
        }

        function downloadTemplate() {
            const ws = XLSX.utils.aoa_to_sheet([['單位', '姓名'], ['人力資源部', '王大明'], ['資訊部', '李小美']]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "員工清單範例");
            XLSX.writeFile(wb, "員工服裝尺寸登記模板.xlsx");
        }

        function exportResults() {
            const wb = XLSX.utils.book_new();
            const now = new Date();
            const dateStr = now.toLocaleString('zh-TW', { hour12: true });

            // --- 1. 建立「全公司總計」Sheet ---
            let totalEmps = employees.length;
            let totalM = employees.filter(e => e.gender === '男').length;
            let totalF = employees.filter(e => e.gender === '女').length;

            const summaryData = [];
            summaryData.push(['全公司服裝尺寸登記匯總報表']);
            summaryData.push([`報表日期：${dateStr}`]);
            summaryData.push([]);
            summaryData.push(['【公司人員概況】']);
            summaryData.push(['總人數', totalEmps, '人']);
            summaryData.push(['男生總數', totalM, '人']);
            summaryData.push(['女生總數', totalF, '人']);
            summaryData.push([]);
            summaryData.push(['【全公司各項目尺寸總計】']);
            summaryData.push(['項目', '性別', ...SIZES, '合計']);

            config.activeItems.forEach(item => {
                ['男', '女'].forEach(g => {
                    const row = [item, g === '男' ? '男性' : '女性'];
                    let rowTotal = 0;
                    SIZES.forEach(sz => {
                        const count = employees.filter(e => e.gender === g && e.sizes[item] === sz).length;
                        row.push(count);
                        rowTotal += count;
                    });
                    row.push(rowTotal);
                    summaryData.push(row);
                });
            });

            const wsSummary = XLSX.utils.aoa_to_sheet(summaryData);
            XLSX.utils.book_append_sheet(wb, wsSummary, "全公司總計");

            // --- 2. 依「單位」分別建立 Sheet ---
            const units = [...new Set(employees.map(e => e.unit))].sort();
            units.forEach(u => {
                const unitEmps = employees.filter(e => e.unit === u);
                const unitData = [];
                
                unitData.push([`${u} 服裝尺寸明細與統計`]);
                unitData.push([]);
                unitData.push(['【人員明細】']);
                
                const header = ['姓名', '性別', ...config.activeItems];
                unitData.push(header);
                
                unitEmps.forEach(emp => {
                    const row = [emp.name, emp.gender || '未填寫'];
                    config.activeItems.forEach(item => {
                        row.push(emp.sizes[item] || '未填寫');
                    });
                    unitData.push(row);
                });
                
                unitData.push([]);
                unitData.push(['【單位各項目尺寸總計】']);
                unitData.push(['項目', '性別', ...SIZES, '小計']);
                
                config.activeItems.forEach(item => {
                    ['男', '女'].forEach(g => {
                        const row = [item, g];
                        let rowTotal = 0;
                        SIZES.forEach(sz => {
                            const count = unitEmps.filter(e => e.gender === g && e.sizes[item] === sz).length;
                            row.push(count);
                            rowTotal += count;
                        });
                        row.push(rowTotal);
                        unitData.push(row);
                    });
                });
                
                const wsUnit = XLSX.utils.aoa_to_sheet(unitData);
                const safeSheetName = u.length > 30 ? u.substring(0, 30) : u;
                XLSX.utils.book_append_sheet(wb, wsUnit, safeSheetName);
            });

            const fileName = `尺寸登記統計報表_${Math.floor(Math.random()*100)}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        // --- 把需由 HTML onclick 觸發的函數掛載到 global window 上 ---
        window.downloadTemplate = downloadTemplate;
        window.toggleMobileMenu = toggleMobileMenu;
        window.switchTab = switchTab;
        window.goHomeAndClear = goHomeAndClear;
        window.toggleAdmin = toggleAdmin;
        window.renderEmployeeList = renderEmployeeList;
        window.exportResults = exportResults;
        window.addNewProjectItem = addNewProjectItem;
        window.manualAddEmployee = manualAddEmployee;
        window.renderManageList = renderManageList;
        window.closeConfirmModal = closeConfirmModal;
        window.verifyPassword = verifyPassword;
        window.closePasswordModal = closePasswordModal;
        window.selectUnit = selectUnit;
        window.updateGender = updateGender;
        window.updateSize = updateSize;
        window.toggleProjectItem = toggleProjectItem;
        window.removeEmployee = removeEmployee;
        window.setSummaryItem = setSummaryItem;
    </script>
</body>
</html>
