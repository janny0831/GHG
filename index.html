<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工服裝尺寸登記系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .hide { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        /* 增加按鈕點擊範圍感 */
        .btn-icon-hover:hover {
            background-color: #fee2e2;
            color: #ef4444;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div id="welcome-screen" class="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-10 max-w-md w-full text-center border border-slate-100">
            <div class="w-24 h-24 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-8">
                <i data-lucide="shirt" size="48"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 mb-3">大量 管理部員工服裝尺寸登記系統</h1>
            <p class="text-slate-400 mb-10 font-medium">請匯入您的員工名單來開始使用</p>
            
            <div class="space-y-4">
                <input type="file" id="file-input-initial" accept=".xlsx, .xls" class="hidden">
                <button onclick="document.getElementById('file-input-initial').click()" class="w-full flex items-center justify-center gap-3 bg-indigo-600 text-white py-4 px-6 rounded-2xl hover:bg-indigo-700 transition-all font-bold shadow-lg shadow-indigo-200 active:scale-95">
                    <i data-lucide="upload"></i> 匯入 XLSX 檔案
                </button>
                <button onclick="downloadTemplate()" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-100 text-slate-600 py-4 px-6 rounded-2xl hover:bg-slate-50 transition-all font-bold active:scale-95">
                    <i data-lucide="file-down"></i> 下載空白範例檔
                </button>
            </div>
        </div>
    </div>

    <div id="main-app" class="min-h-screen flex flex-col md:flex-row hide">
        <div class="md:hidden bg-indigo-600 text-white p-4 flex items-center justify-between shadow-md z-20">
            <div class="flex items-center gap-2">
                <i data-lucide="shirt"></i>
                <span class="font-bold">尺寸登記系統</span>
            </div>
            <button onclick="toggleMobileMenu()" class="p-2 bg-indigo-700 rounded-lg">
                <i data-lucide="menu" id="menu-icon"></i>
            </button>
        </div>

        <aside id="sidebar" class="fixed md:static inset-0 z-30 bg-white border-r border-slate-200 w-full md:w-80 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0">
            <div class="p-6 border-b border-slate-200 hidden md:block">
                <div class="flex items-center gap-3 text-indigo-600 mb-2">
                    <i data-lucide="shirt" size="28"></i>
                    <h1 class="text-xl font-bold text-slate-800">尺寸登記系統</h1>
                </div>
                <div class="w-full bg-slate-100 h-2 rounded-full mt-4 overflow-hidden">
                    <div id="total-progress-bar" class="bg-indigo-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <p class="text-xs text-slate-500 mt-2 text-right">總進度：<span id="total-progress-text">0 / 0</span></p>
            </div>

            <div class="flex flex-col p-4 border-b border-slate-100 bg-slate-50/50">
                <div class="flex gap-1 mb-2 bg-white p-1 rounded-xl border border-slate-200">
                    <button onclick="switchTab('list')" id="tab-btn-list" class="flex-1 py-2 rounded-lg flex items-center justify-center gap-2 text-xs font-bold transition">
                        <i data-lucide="users" size="14"></i> 尺寸登記
                    </button>
                    <button onclick="switchTab('summary')" id="tab-btn-summary" class="flex-1 py-2 rounded-lg flex items-center justify-center gap-2 text-xs font-bold transition">
                        <i data-lucide="bar-chart-3" size="14"></i> 總統計表
                    </button>
                </div>
                <button onclick="switchTab('manage')" id="tab-btn-manage" class="w-full py-2 rounded-xl flex items-center justify-center gap-2 text-xs font-bold transition border border-slate-200 bg-white text-slate-600 hover:bg-slate-50">
                    <i data-lucide="user-cog" size="14"></i> 人員異動管理
                </button>
            </div>

            <div id="unit-list-wrapper" class="flex-1 flex flex-col overflow-hidden">
                <div id="unit-list-container" class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar"></div>
            </div>
            
            <div class="p-4 border-t border-slate-200 space-y-2 pb-10 md:pb-4">
                <button id="btn-restart-sys" onclick="goHomeAndClear()" class="w-full py-2.5 flex items-center justify-center gap-2 text-sm font-bold text-slate-500 bg-slate-50 rounded-xl hover:bg-slate-100 transition active:scale-95 border border-slate-200">
                    <i data-lucide="refresh-ccw" size="18"></i> 重新開始 (清空資料)
                </button>
                <button id="btn-admin-toggle" onclick="toggleAdmin()" class="w-full py-2.5 flex items-center justify-center gap-2 text-sm font-bold text-indigo-600 bg-indigo-50 rounded-xl hover:bg-indigo-100 transition active:scale-95">
                    <i data-lucide="unlock" size="18"></i> 管理員登入
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-hidden flex flex-col h-full bg-slate-50">
            
            <div id="view-list" class="flex-1 flex flex-col h-full overflow-hidden">
                <div class="bg-white p-6 shadow-sm border-b border-slate-200">
                    <div class="flex flex-col lg:flex-row justify-between gap-6">
                        <div class="space-y-4 flex-1">
                            <div>
                                <h2 id="current-unit-name" class="text-2xl font-black text-slate-800">未選取單位</h2>
                                <div class="flex items-center gap-4 mt-1 text-sm text-slate-500 font-medium">
                                    <span class="flex items-center gap-1"><i data-lucide="users" size="14"></i> 單位人數: <span id="unit-count">0</span> 人</span>
                                    <span id="unit-complete-badge" class="hide text-emerald-600 flex items-center gap-1 bg-emerald-50 px-2 py-0.5 rounded-full"><i data-lucide="check-circle-2" size="14"></i> 已完成</span>
                                </div>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 overflow-x-auto">
                                <div id="unit-size-mini-stats" class="flex gap-2 min-w-max"></div>
                            </div>
                        </div>
                        <div class="relative self-end lg:self-center w-full lg:w-72">
                            <i data-lucide="search" size="18" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="search-input" placeholder="搜尋姓名..." oninput="renderEmployeeList()" class="w-full pl-10 pr-4 py-2 bg-slate-100 border-2 border-transparent rounded-xl focus:bg-white focus:border-indigo-500 outline-none transition">
                        </div>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto p-4 lg:p-6 custom-scrollbar">
                    <div id="employee-cards-container" class="max-w-4xl mx-auto space-y-3"></div>
                </div>
            </div>

            <div id="view-summary" class="flex-1 overflow-y-auto bg-slate-50 p-6 md:p-10 custom-scrollbar hide">
                <div class="max-w-4xl mx-auto">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-10">
                        <div>
                            <h2 class="text-3xl font-black text-slate-800">全公司尺寸總計</h2>
                            <p class="text-slate-400 font-medium">統計所有已完成登記的人員</p>
                        </div>
                        <button onclick="exportResults()" class="flex items-center gap-2 bg-emerald-600 text-white py-3 px-6 rounded-2xl hover:bg-emerald-700 transition font-bold shadow-lg active:scale-95">
                            <i data-lucide="download"></i> 匯出結果 (XLSX)
                        </button>
                    </div>
                    <div id="global-summary-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10"></div>
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-6 bg-slate-800 text-white">各單位填寫進度</div>
                        <div id="unit-summary-list" class="divide-y divide-slate-100"></div>
                    </div>
                </div>
            </div>

            <div id="view-manage" class="flex-1 overflow-y-auto bg-slate-50 p-6 md:p-10 custom-scrollbar hide">
                <div class="max-w-4xl mx-auto">
                    <h2 class="text-3xl font-black text-slate-800 mb-2">人員異動管理</h2>
                    <p class="text-slate-400 font-medium mb-8">在這裡處理新進、離職人員，或增量匯入名單</p>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i data-lucide="user-plus" size="18"></i> 手動新增人員</h3>
                            <div class="space-y-3">
                                <input type="text" id="manual-name" placeholder="員工姓名" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <input type="text" id="manual-unit" placeholder="所屬單位" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <button onclick="manualAddEmployee()" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold hover:bg-indigo-700 transition">確認新增</button>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl border border-indigo-100 bg-indigo-50/30 shadow-sm flex flex-col justify-center items-center text-center">
                            <i data-lucide="refresh-cw" size="32" class="text-indigo-500 mb-3"></i>
                            <h3 class="font-bold text-slate-700 mb-2">增量匯入 (不影響現有尺寸)</h3>
                            <p class="text-xs text-slate-500 mb-4">適合中途有新員工加入時更新名單</p>
                            <input type="file" id="file-input-incremental" accept=".xlsx, .xls" class="hidden">
                            <button onclick="document.getElementById('file-input-incremental').click()" class="bg-white border-2 border-indigo-200 text-indigo-600 px-6 py-2 rounded-xl font-bold hover:bg-indigo-50 transition">選擇檔案更新</button>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                            <h3 class="font-bold text-slate-800">員工總覽 (<span id="manage-total-count">0</span>)</h3>
                            <div class="relative w-48">
                                <i data-lucide="search" size="14" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="manage-search" oninput="renderManageList()" placeholder="篩選人員/單位..." class="w-full pl-8 pr-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 transition">
                            </div>
                        </div>
                        <div id="manage-employee-list" class="divide-y divide-slate-100 max-h-[500px] overflow-y-auto custom-scrollbar">
                            </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="custom-confirm-modal" class="fixed inset-0 bg-slate-900/50 z-[100] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 transform scale-95 transition-transform duration-300" id="custom-confirm-box">
            <div id="confirm-icon-container" class="w-14 h-14 rounded-full flex items-center justify-center mb-5 mx-auto">
                <i data-lucide="alert-triangle" size="28" id="confirm-icon"></i>
            </div>
            <h3 id="confirm-title" class="text-xl font-black text-center text-slate-800 mb-2">確認操作</h3>
            <p id="confirm-message" class="text-slate-500 text-sm text-center mb-8 font-medium">您確定要執行此操作嗎？</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition active:scale-95">取消</button>
                <button id="confirm-action-btn" class="flex-1 py-3 text-white font-bold rounded-xl transition shadow-lg active:scale-95">確定</button>
            </div>
        </div>
    </div>

    <div id="custom-alert-modal" class="fixed inset-0 bg-slate-900/50 z-[100] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 transform scale-95 transition-transform duration-300" id="custom-alert-box">
            <div class="w-14 h-14 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center mb-5 mx-auto">
                <i data-lucide="info" size="28"></i>
            </div>
            <h3 id="alert-title" class="text-xl font-black text-center text-slate-800 mb-2">提示</h3>
            <p id="alert-message" class="text-slate-500 text-sm text-center mb-8 font-medium">操作完成</p>
            <button onclick="closeAlertModal()" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 active:scale-95">確定</button>
        </div>
    </div>

    <div id="password-modal" class="fixed inset-0 bg-slate-900/50 z-[110] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 transform scale-95 transition-transform duration-300" id="password-box">
            <h3 class="text-xl font-black text-center text-slate-800 mb-2">管理員驗證</h3>
            <p class="text-slate-500 text-sm text-center mb-6 font-medium">請輸入密碼以解鎖統計與異動功能</p>
            <input type="password" id="admin-password-input" placeholder="請輸入密碼 (預設: admin)" onkeyup="if(event.key === 'Enter') verifyPassword()" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 mb-6 text-center tracking-widest font-bold">
            <div class="flex gap-3">
                <button onclick="closePasswordModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition active:scale-95">取消</button>
                <button onclick="verifyPassword()" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 active:scale-95">解鎖</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // Firebase 設定檔 (已使用您提供的 API KEY)
        const firebaseConfig = {
            apiKey: "AIzaSyD4xB2mpR2pUZBMjyTFjX4NVoZw1unotlE",
            authDomain: "ghgtl-5f69d.firebaseapp.com",
            projectId: "ghgtl-5f69d",
            storageBucket: "ghgtl-5f69d.firebasestorage.app",
            messagingSenderId: "528274392886",
            appId: "1:528274392886:web:6c6475a0621f497a26d597",
            measurementId: "G-W22Y07F9LJ"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        
        // 設定雲端儲存位置 (將資料統一存在 collection 'clothingApp', document 'mainData')
        const dataDocRef = doc(db, 'clothingApp', 'mainData');

        const SIZES = ['XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL'];
        let employees = [];
        let selectedUnit = null;
        let activeTab = 'list';
        let isMobileMenuOpen = false;
        let confirmActionCallback = null;
        let isAdmin = sessionStorage.getItem('clothingAdmin') === 'true';

        window.onload = () => {
            lucide.createIcons();
            loadDataFromFirebase();
            setupFiles();
            setupModalEvents();
            updateAdminUI();
        };

        // --- Firebase 儲存與讀取功能 ---
        function loadDataFromFirebase() {
            // 取代原本 localStorage，改為即時監聽 Firestore
            onSnapshot(dataDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    employees = docSnap.data().employees || [];
                    if (employees.length > 0) {
                        if (!selectedUnit || !employees.some(e => e.unit === selectedUnit)) {
                            selectedUnit = employees[0].unit;
                        }
                        showMainApp();
                    } else {
                        // 若資料庫內無人員，回到歡迎頁面
                        document.getElementById('welcome-screen').classList.remove('hide');
                        document.getElementById('main-app').classList.add('hide');
                    }
                    renderAll();
                } else {
                    // 第一次使用系統，資料庫尚無文件
                    console.log("No data found in Firebase.");
                }
            }, (error) => {
                console.error("Firebase read error: ", error);
            });
        }

        async function saveToFirebase(newEmployeesData) {
            try {
                // 將最新的陣列寫入 Firestore
                await setDoc(dataDocRef, { employees: newEmployeesData });
            } catch (error) {
                console.error("Error writing to Firebase: ", error);
                showAlertModal('錯誤', '資料庫儲存失敗，請檢查網路連線。');
            }
        }

        function setupModalEvents() {
            document.getElementById('confirm-action-btn').addEventListener('click', () => {
                if (confirmActionCallback) confirmActionCallback();
                closeConfirmModal();
            });
        }

        function showConfirmModal(title, message, confirmBtnText, confirmBtnClass, iconClass, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            
            const actionBtn = document.getElementById('confirm-action-btn');
            actionBtn.innerText = confirmBtnText;
            actionBtn.className = `flex-1 py-3 text-white font-bold rounded-xl transition shadow-lg active:scale-95 ${confirmBtnClass}`;
            
            const iconContainer = document.getElementById('confirm-icon-container');
            iconContainer.className = `w-14 h-14 rounded-full flex items-center justify-center mb-5 mx-auto ${iconClass}`;

            confirmActionCallback = callback;
            
            const modal = document.getElementById('custom-confirm-modal');
            const box = document.getElementById('custom-confirm-box');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
        }

        function closeConfirmModal() {
            const modal = document.getElementById('custom-confirm-modal');
            const box = document.getElementById('custom-confirm-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            confirmActionCallback = null;
        }

        function showAlertModal(title, message) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            const modal = document.getElementById('custom-alert-modal');
            const box = document.getElementById('custom-alert-box');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
        }

        function closeAlertModal() {
            const modal = document.getElementById('custom-alert-modal');
            const box = document.getElementById('custom-alert-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
        }

        // --- 管理員權限相關邏輯 ---
        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                sessionStorage.removeItem('clothingAdmin');
                if (activeTab !== 'list') switchTab('list');
                updateAdminUI();
                showAlertModal('已登出', '管理員權限已鎖定，回到一般人員模式。');
            } else {
                const modal = document.getElementById('password-modal');
                const box = document.getElementById('password-box');
                modal.classList.remove('opacity-0', 'pointer-events-none');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
                document.getElementById('admin-password-input').value = '';
                setTimeout(() => document.getElementById('admin-password-input').focus(), 100);
            }
        }

        function closePasswordModal() {
            const modal = document.getElementById('password-modal');
            const box = document.getElementById('password-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
        }

        function verifyPassword() {
            const pwd = document.getElementById('admin-password-input').value;
            if (pwd === 'admin') { // 預設密碼
                isAdmin = true;
                sessionStorage.setItem('clothingAdmin', 'true');
                closePasswordModal();
                updateAdminUI();
                showAlertModal('解鎖成功', '已開啟管理員權限，可使用所有設定與統計功能。');
            } else {
                alert('密碼錯誤！請重新輸入。');
            }
        }

        function updateAdminUI() {
            document.getElementById('tab-btn-summary').classList.toggle('hide', !isAdmin);
            document.getElementById('tab-btn-manage').classList.toggle('hide', !isAdmin);
            document.getElementById('btn-restart-sys').classList.toggle('hide', !isAdmin);

            const adminBtn = document.getElementById('btn-admin-toggle');
            if (isAdmin) {
                adminBtn.innerHTML = '<i data-lucide="lock" size="18"></i> 退出管理員模式';
                adminBtn.className = 'w-full py-2.5 flex items-center justify-center gap-2 text-sm font-bold text-slate-500 bg-slate-100 rounded-xl hover:bg-slate-200 transition active:scale-95';
            } else {
                adminBtn.innerHTML = '<i data-lucide="unlock" size="18"></i> 管理員登入';
                adminBtn.className = 'w-full py-2.5 flex items-center justify-center gap-2 text-sm font-bold text-indigo-600 bg-indigo-50 rounded-xl hover:bg-indigo-100 transition active:scale-95';
            }
            lucide.createIcons();
        }

        function setupFiles() {
            document.getElementById('file-input-initial').addEventListener('change', (e) => handleFile(e, true));
            document.getElementById('file-input-incremental').addEventListener('change', (e) => handleFile(e, false));
        }

        function handleFile(e, isInitial) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                
                if (isInitial) {
                    employees = [];
                }

                const startIndex = (data[0] && (data[0][0] === '單位' || data[0][1] === '姓名')) ? 1 : 0;
                let added = 0;
                let existing = 0;
                
                for (let i = startIndex; i < data.length; i++) {
                    const row = data[i];
                    if (row && row[0] && row[1]) {
                        const unit = String(row[0]).trim();
                        const name = String(row[1]).trim();
                        
                        const exists = employees.find(e => e.unit === unit && e.name === name);
                        if (!exists) {
                            employees.push({
                                id: `emp_${Date.now()}_${i}_${Math.random().toString(36).substr(2, 5)}`,
                                unit, name, size: null
                            });
                            added++;
                        } else {
                            existing++;
                        }
                    }
                }

                saveToFirebase(employees);
                showMainApp();
                
                if (isInitial) {
                    isAdmin = true;
                    sessionStorage.setItem('clothingAdmin', 'true');
                    updateAdminUI();
                    showAlertModal('匯入成功', `已清空舊紀錄並建立名單，共 ${added} 人。`);
                } else {
                    showAlertModal('更新完成', `新增了 ${added} 人，保留了 ${existing} 人的現有紀錄。`);
                }
                
                if (employees.length > 0 && (!selectedUnit || !employees.some(e => e.unit === selectedUnit))) {
                    selectedUnit = employees[0].unit;
                }
                renderAll();
            };
            reader.readAsBinaryString(file);
            e.target.value = '';
        }

        function showMainApp() {
            document.getElementById('welcome-screen').classList.add('hide');
            document.getElementById('main-app').classList.remove('hide');
        }

        function switchTab(tab) {
            if (!isAdmin && tab !== 'list') return;
            
            activeTab = tab;
            ['list', 'summary', 'manage'].forEach(t => {
                document.getElementById(`view-${t}`).classList.toggle('hide', t !== tab);
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === 'manage') {
                    btn.className = tab === 'manage' ? 'w-full py-2 rounded-xl flex items-center justify-center gap-2 text-xs font-bold transition border border-indigo-200 bg-indigo-50 text-indigo-700' : 'w-full py-2 rounded-xl flex items-center justify-center gap-2 text-xs font-bold transition border border-slate-200 bg-white text-slate-600 hover:bg-slate-50';
                } else {
                    btn.className = tab === t ? 'flex-1 py-2 rounded-lg flex items-center justify-center gap-2 text-xs font-bold transition bg-indigo-600 text-white shadow-inner' : 'flex-1 py-2 rounded-lg flex items-center justify-center gap-2 text-xs font-bold transition text-slate-500 hover:bg-slate-50';
                }
            });
            document.getElementById('unit-list-wrapper').classList.toggle('hide', tab === 'manage');
            renderAll();
        }

        function renderAll() {
            renderSidebar();
            renderEmployeeList();
            renderSummary();
            renderManageList();
            updateProgress();
            lucide.createIcons();
        }

        function renderSidebar() {
            const container = document.getElementById('unit-list-container');
            const stats = getUnitStats();
            container.innerHTML = stats.map(s => `
                <button onclick="selectUnit('${s.unit}')" class="w-full flex items-center p-3 rounded-xl transition-all text-left border ${selectedUnit === s.unit ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-slate-700 border-transparent hover:border-slate-200'}">
                    <div class="flex-1">
                        <div class="font-bold text-sm">${s.unit}</div>
                        <div class="text-[10px] ${selectedUnit === s.unit ? 'text-indigo-100' : 'text-slate-400'}">${s.completed}/${s.total} 已填</div>
                    </div>
                    ${s.isComplete ? '<i data-lucide="check-circle-2" class="w-4 h-4 ' + (selectedUnit === s.unit ? 'text-indigo-200' : 'text-emerald-500') + '"></i>' : ''}
                </button>
            `).join('');
        }

        function renderEmployeeList() {
            const query = document.getElementById('search-input').value;
            const container = document.getElementById('employee-cards-container');
            const unitEmps = employees.filter(e => e.unit === selectedUnit);
            const filtered = unitEmps.filter(e => e.name.includes(query));
            
            document.getElementById('current-unit-name').innerText = selectedUnit || "未選擇";
            document.getElementById('unit-count').innerText = unitEmps.length;
            const completed = unitEmps.filter(e => e.size).length;
            document.getElementById('unit-complete-badge').classList.toggle('hide', unitEmps.length === 0 || completed !== unitEmps.length);
            
            const uStats = {};
            SIZES.forEach(s => uStats[s] = 0);
            unitEmps.forEach(e => { if(e.size) uStats[e.size]++ });
            
            document.getElementById('unit-size-mini-stats').innerHTML = SIZES.map(s => `
                <div class="bg-white px-3 py-1 rounded border border-slate-100 text-center min-w-[50px]">
                    <div class="text-[9px] text-slate-400 font-bold">${s}</div>
                    <div class="text-xs font-black text-indigo-600">${uStats[s]}</div>
                </div>
            `).join('');

            container.innerHTML = filtered.map(emp => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4 ${emp.size ? 'border-slate-200 opacity-90' : 'border-indigo-100 ring-2 ring-indigo-50 bg-white'}">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-white ${emp.size ? 'bg-slate-300' : 'bg-indigo-500 shadow-md shadow-indigo-100'}">${emp.name.charAt(0)}</div>
                        <div class="font-bold text-slate-800">${emp.name}</div>
                    </div>
                    <div class="flex flex-wrap gap-1">
                        ${SIZES.map(sz => `<button onclick="updateSize('${emp.id}', '${sz}')" class="min-w-[42px] px-2 py-1.5 rounded-lg text-xs font-black transition-all ${emp.size === sz ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'}">${sz}</button>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderManageList() {
            const filter = document.getElementById('manage-search').value.trim().toLowerCase();
            const container = document.getElementById('manage-employee-list');
            document.getElementById('manage-total-count').innerText = employees.length;
            
            const filtered = employees.filter(e => e.name.toLowerCase().includes(filter) || e.unit.toLowerCase().includes(filter))
                .sort((a, b) => a.unit.localeCompare(b.unit));
                
            container.innerHTML = filtered.length > 0 ? filtered.map(emp => `
                <div class="p-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
                    <div class="flex items-center gap-3">
                        <span class="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-1 rounded tracking-wider">${emp.unit}</span>
                        <span class="font-bold text-slate-800">${emp.name}</span>
                        ${emp.size ? `<span class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 rounded font-bold">已填: ${emp.size}</span>` : `<span class="text-[10px] bg-slate-100 text-slate-400 px-1.5 rounded font-bold">未填</span>`}
                    </div>
                    <button onclick="removeEmployee('${emp.id}')" class="p-2 text-slate-300 hover:text-red-500 transition-colors btn-icon-hover rounded-full">
                        <i data-lucide="trash-2" size="18"></i>
                    </button>
                </div>
            `).join('') : `<div class="p-10 text-center text-slate-400">找不到符合的人員</div>`;
            
            lucide.createIcons();
        }

        function removeEmployee(id) {
            const emp = employees.find(e => e.id === id);
            if (emp) {
                showConfirmModal(
                    '移除人員',
                    `確定要移除「${emp.unit} - ${emp.name}」嗎？此操作不可撤銷。`,
                    '確定移除',
                    'bg-red-600 hover:bg-red-700 shadow-red-200',
                    'bg-red-50 text-red-500',
                    () => {
                        employees = employees.filter(e => e.id !== id);
                        saveToFirebase(employees);
                        renderAll();
                    }
                );
            }
        }

        function manualAddEmployee() {
            const name = document.getElementById('manual-name').value.trim();
            const unit = document.getElementById('manual-unit').value.trim();
            if (!name || !unit) return showAlertModal('提示', '請填寫完整的員工姓名與所屬單位。');
            employees.push({ id: `manual_${Date.now()}`, name, unit, size: null });
            document.getElementById('manual-name').value = '';
            document.getElementById('manual-unit').value = '';
            saveToFirebase(employees);
            renderAll();
        }

        function renderSummary() {
            const gStats = {};
            SIZES.forEach(s => gStats[s] = 0);
            let unselected = 0;
            employees.forEach(e => { if(e.size) gStats[e.size]++; else unselected++; });
            
            document.getElementById('global-summary-grid').innerHTML = SIZES.map(s => `
                <div class="bg-white p-5 rounded-3xl border border-slate-100 text-center">
                    <div class="text-slate-400 text-[10px] font-bold mb-1 uppercase tracking-widest">${s}</div>
                    <div class="text-3xl font-black text-indigo-600">${gStats[s]}</div>
                </div>
            `).join('') + `
                <div class="bg-orange-500 p-5 rounded-3xl text-center text-white shadow-lg shadow-orange-100">
                    <div class="text-orange-200 text-[10px] font-bold mb-1 uppercase tracking-widest">未填寫</div>
                    <div class="text-3xl font-black">${unselected}</div>
                </div>
            `;

            const uStats = getUnitStats();
            document.getElementById('unit-summary-list').innerHTML = uStats.map(s => `
                <div class="p-5 flex items-center justify-between">
                    <span class="font-bold text-slate-700">${s.unit}</span>
                    <span class="text-sm font-black text-slate-800">${s.completed} / ${s.total}</span>
                </div>
            `).join('');
        }

        function getUnitStats() {
            const stats = {};
            employees.forEach(emp => {
                if (!stats[emp.unit]) stats[emp.unit] = { total: 0, completed: 0 };
                stats[emp.unit].total++;
                if (emp.size) stats[emp.unit].completed++;
            });
            return Object.entries(stats).map(([unit, d]) => ({ unit, total: d.total, completed: d.completed, isComplete: d.total === d.completed }))
                .sort((a, b) => a.unit.localeCompare(b.unit));
        }

        function updateProgress() {
            const comp = employees.filter(e => e.size).length;
            const total = employees.length;
            const rate = total === 0 ? 0 : Math.round((comp / total) * 100);
            document.getElementById('total-progress-bar').style.width = rate + '%';
            document.getElementById('total-progress-text').innerText = `${comp} / ${total}`;
        }

        function updateSize(id, sz) {
            employees = employees.map(e => e.id === id ? { ...e, size: (e.size === sz ? null : sz) } : e);
            saveToFirebase(employees);
            renderAll();
        }

        function selectUnit(u) {
            selectedUnit = u;
            if (isMobileMenuOpen) toggleMobileMenu();
            renderAll();
        }

        function toggleMobileMenu() {
            isMobileMenuOpen = !isMobileMenuOpen;
            document.getElementById('sidebar').style.transform = isMobileMenuOpen ? 'translateX(0)' : 'translateX(-100%)';
            document.getElementById('menu-icon').setAttribute('data-lucide', isMobileMenuOpen ? 'x' : 'menu');
            lucide.createIcons();
        }

        function goHomeAndClear() {
            showConfirmModal(
                '重新開始',
                '確定要重新開始嗎？這將會清空雲端資料庫的所有名單與已登記的尺寸。',
                '確定清空',
                'bg-red-600 hover:bg-red-700 shadow-red-200',
                'bg-red-50 text-red-500',
                () => {
                    saveToFirebase([]); // 將 Firebase 資料清空
                    window.location.reload();
                }
            );
        }

        function downloadTemplate() {
            const ws = XLSX.utils.aoa_to_sheet([['單位', '姓名'], ['人力資源部', '王大明'], ['資訊部', '李小美']]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "員工清單範例");
            XLSX.writeFile(wb, "員工服裝尺寸登記模板.xlsx");
        }

        function exportResults() {
            const data = [['單位', '姓名', '服裝尺寸'], ...employees.map(e => [e.unit, e.name, e.size || '尚未填寫'])];
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "尺寸登記統計");
            XLSX.writeFile(wb, `服裝尺寸統計結果_${new Date().toLocaleDateString()}.xlsx`);
        }

        // 將需要在 HTML 標籤內直接透過 onclick 呼叫的函式，綁定到全域的 window 物件上
        window.downloadTemplate = downloadTemplate;
        window.toggleMobileMenu = toggleMobileMenu;
        window.switchTab = switchTab;
        window.goHomeAndClear = goHomeAndClear;
        window.toggleAdmin = toggleAdmin;
        window.renderEmployeeList = renderEmployeeList;
        window.exportResults = exportResults;
        window.manualAddEmployee = manualAddEmployee;
        window.renderManageList = renderManageList;
        window.closeConfirmModal = closeConfirmModal;
        window.closeAlertModal = closeAlertModal;
        window.verifyPassword = verifyPassword;
        window.closePasswordModal = closePasswordModal;
        window.selectUnit = selectUnit;
        window.updateSize = updateSize;
        window.removeEmployee = removeEmployee;

    </script>
</body>
</html>
