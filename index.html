<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工服裝尺寸登記系統 - 雲端同步版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .hide { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .btn-icon-hover:hover { background-color: #fee2e2; color: #ef4444; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col md:flex-row overflow-hidden">

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-6 border-b border-slate-100 flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white">
                <i data-lucide="shirt" class="w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">服裝登記</h1>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button onclick="switchView('step1')" id="nav-step1" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold bg-indigo-50 text-indigo-700">
                <i data-lucide="user-plus" class="w-5 h-5"></i> 匯入與新增名單
            </button>
            <button onclick="switchView('step2')" id="nav-step2" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-50 transition-colors">
                <i data-lucide="check-square" class="w-5 h-5"></i> 尺寸登記作業
            </button>
            <button onclick="switchView('results')" id="nav-results" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-50 transition-colors">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i> 統計與報表匯出
            </button>
        </nav>
        <div class="p-4 border-t border-slate-100">
            <button onclick="goHomeAndClear()" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-sm font-bold text-red-500 hover:bg-red-50 transition-colors">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> 重新開始系統
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 md:ml-64 relative">
        <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-40">
            <button onclick="toggleMobileMenu()" class="md:hidden p-2 text-slate-600">
                <i data-lucide="menu" id="menu-icon"></i>
            </button>
            <div class="flex items-center gap-4 ml-auto">
                <span class="text-xs font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full uppercase tracking-widest">Cloud Database v2.0</span>
            </div>
        </header>

        <div class="flex-1 p-4 md:p-8 overflow-y-auto custom-scrollbar">
            <section id="view-step1" class="max-w-4xl mx-auto space-y-6">
                <div class="bg-indigo-600 rounded-[32px] p-8 text-white shadow-xl shadow-indigo-100 relative overflow-hidden">
                    <div class="relative z-10">
                        <h2 class="text-2xl font-black mb-2 tracking-tight">建立員工名單</h2>
                        <p class="text-indigo-100 opacity-80 text-sm">請上傳 Excel 檔案或點擊右側下載範本進行填寫。</p>
                    </div>
                    <div class="mt-6 flex flex-wrap gap-3 relative z-10">
                        <label class="bg-white text-indigo-600 px-6 py-3 rounded-2xl font-black text-sm cursor-pointer hover:bg-indigo-50 transition-all flex items-center gap-2 shadow-sm">
                            <i data-lucide="file-up" class="w-4 h-4"></i> 批次匯入名單
                            <input type="file" class="hidden" accept=".xlsx, .xls" onchange="handleFileUpload(this)">
                        </label>
                        <button onclick="downloadTemplate()" class="bg-indigo-700/50 text-white px-6 py-3 rounded-2xl font-black text-sm hover:bg-indigo-700 transition-all flex items-center gap-2 border border-indigo-400/30">
                            <i data-lucide="download" class="w-4 h-4"></i> 下載範本
                        </button>
                    </div>
                </div>
            </section>

            <section id="view-step2" class="hide max-w-5xl mx-auto space-y-6">
                <div id="registration-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    </div>
            </section>

            <section id="view-results" class="hide max-w-5xl mx-auto space-y-6">
                <div class="bg-white rounded-[32px] p-8 shadow-sm border border-slate-200">
                    <div class="flex items-center justify-between mb-8">
                        <h2 class="text-2xl font-black text-slate-800">登記結果匯總</h2>
                        <button onclick="exportResults()" class="bg-emerald-600 text-white px-6 py-3 rounded-2xl font-black text-sm hover:bg-emerald-700 transition-all flex items-center gap-2">
                            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> 匯出報表
                        </button>
                    </div>
                    <div id="results-table-container" class="overflow-x-auto rounded-2xl border border-slate-100">
                        </div>
                </div>
            </section>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, setDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // 您提供的 Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyD4xB2mpR2pUZBMjyTFjX4NVoZw1unotlE",
            authDomain: "ghgtl-5f69d.firebaseapp.com",
            projectId: "ghgtl-5f69d",
            storageBucket: "ghgtl-5f69d.firebasestorage.app",
            messagingSenderId: "528274392886",
            appId: "1:528274392886:web:6c6475a0621f497a26d597",
            measurementId: "G-W22Y07F9LJ"
        };

        // 初始化
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let employees = []; // 員工清單陣列

        // 匿名登入並同步資料
        signInAnonymously(auth).then(() => {
            // 實時監聽 Firestore 資料
            onSnapshot(collection(db, "employeeSizeData"), (snapshot) => {
                employees = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderAll(); // 渲染介面
            });
        });

        // 核心邏輯介面切換
        window.switchView = function(viewId) {
            ['step1', 'step2', 'results'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hide');
                document.getElementById(`nav-${v}`).classList.remove('bg-indigo-50', 'text-indigo-700');
                document.getElementById(`nav-${v}`).classList.add('text-slate-500');
            });
            document.getElementById(`view-${viewId}`).classList.remove('hide');
            document.getElementById(`nav-${viewId}`).classList.add('bg-indigo-50', 'text-indigo-700');
        };

        // 檔案匯入邏輯 (保留原結構並改為上傳 Firebase)
        window.handleFileUpload = function(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);
                
                // 逐筆上傳到 Firebase
                for (let item of json) {
                    if (item['姓名']) {
                        const empId = `${item['單位']}_${item['姓名']}`;
                        await setDoc(doc(db, "employeeSizeData", empId), {
                            unit: item['單位'] || '未分部',
                            name: item['姓名'],
                            size: '',
                            timestamp: serverTimestamp()
                        });
                    }
                }
                switchView('step2');
            };
            reader.readAsArrayBuffer(file);
        };

        // 登記尺寸 (更新 Firebase)
        window.updateSize = async function(id, size) {
            await setDoc(doc(db, "employeeSizeData", id), { size: size }, { merge: true });
        };

        // 渲染函數
        function renderAll() {
            const regList = document.getElementById('registration-list');
            regList.innerHTML = employees.map(e => `
                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${e.unit}</p>
                            <h3 class="text-lg font-black text-slate-800">${e.name}</h3>
                        </div>
                        ${e.size ? '<span class="bg-emerald-100 text-emerald-600 px-3 py-1 rounded-full text-xs font-black">已登記</span>' : '<span class="bg-amber-100 text-amber-600 px-3 py-1 rounded-full text-xs font-black">待登記</span>'}
                    </div>
                    <div class="grid grid-cols-4 gap-2">
                        ${['S', 'M', 'L', 'XL', '2XL', '3XL', '4XL', '5XL'].map(s => `
                            <button onclick="updateSize('${e.id}', '${s}')" class="py-2 rounded-xl text-xs font-bold border transition-all ${e.size === s ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-100' : 'bg-slate-50 text-slate-600 border-slate-100 hover:border-indigo-300'}">
                                ${s}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            // 統計表格渲染
            const resultsContainer = document.getElementById('results-table-container');
            resultsContainer.innerHTML = `
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-400 font-black uppercase tracking-widest">
                        <tr><th class="px-6 py-4">單位</th><th class="px-6 py-4">姓名</th><th class="px-6 py-4">登記尺寸</th></tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        ${employees.map(e => `<tr><td class="px-6 py-4 font-medium">${e.unit}</td><td class="px-6 py-4 font-bold">${e.name}</td><td class="px-6 py-4"><span class="${e.size ? 'text-indigo-600 font-black' : 'text-slate-300'}">${e.size || '未登記'}</span></td></tr>`).join('')}
                    </tbody>
                </table>
            `;
            lucide.createIcons();
        }

        // 下載範本與匯出報表 (保持原邏輯)
        window.downloadTemplate = function() {
            const ws = XLSX.utils.aoa_to_sheet([['單位', '姓名'], ['人力資源部', '王大明'], ['資訊部', '李小美']]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "模板");
            XLSX.writeFile(wb, "尺寸登記模板.xlsx");
        };

        window.exportResults = function() {
            const data = [['單位', '姓名', '尺寸'], ...employees.map(e => [e.unit, e.name, e.size || '未登記'])];
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "結果");
            XLSX.writeFile(wb, "服裝尺寸登記統計結果.xlsx");
        };

        lucide.createIcons();
    </script>
</body>
</html>
