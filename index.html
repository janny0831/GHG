<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工服裝尺寸登記系統 - Firebase 雲端版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .hide { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .btn-icon-hover:hover { background-color: #fee2e2; color: #ef4444; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden text-slate-700">

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-xl lg:shadow-none">
        <div class="p-6 flex items-center gap-3 border-b border-slate-50">
            <div class="bg-red-600 p-2 rounded-xl shadow-lg shadow-red-100">
                <i data-lucide="shirt" class="text-white w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-lg font-black text-slate-800 tracking-tight leading-tight">服裝尺寸登記</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Cloud Sync v1.0</p>
            </div>
        </div>
        
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto custom-scrollbar">
            <button onclick="switchTab('register')" id="nav-register" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-bold transition-all bg-red-50 text-red-600">
                <i data-lucide="user-plus" class="w-5 h-5"></i> 尺寸登記
            </button>
            <button onclick="switchTab('stats')" id="nav-stats" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-bold transition-all text-slate-500 hover:bg-slate-50">
                <i data-lucide="pie-chart" class="w-5 h-5"></i> 尺寸統計
            </button>
            <button onclick="switchTab('manage')" id="nav-manage" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-bold transition-all text-slate-500 hover:bg-slate-50">
                <i data-lucide="users" class="w-5 h-5"></i> 名單管理
            </button>
        </nav>

        <div class="p-4 border-t border-slate-50">
            <button onclick="goHomeAndClear()" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-2xl text-sm font-bold text-red-500 bg-red-50 hover:bg-red-100 transition-all">
                <i data-lucide="refresh-ccw" class="w-4 h-4"></i> 重設所有資料
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 lg:ml-64 relative">
        <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 sticky top-0 z-40">
            <button onclick="toggleMobileMenu()" class="lg:hidden p-2 text-slate-500">
                <i id="menu-icon" data-lucide="menu"></i>
            </button>
            <div class="flex items-center gap-4 ml-auto">
                <div class="flex items-center gap-2 px-3 py-1.5 bg-emerald-50 text-emerald-600 rounded-full text-xs font-bold">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    雲端資料庫已連線
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 lg:p-8 custom-scrollbar">
            <section id="tab-register" class="tab-content max-w-4xl mx-auto space-y-6">
                <div class="bg-white p-8 rounded-[32px] shadow-sm border border-slate-200">
                    <h2 class="text-2xl font-black text-slate-800 mb-6 flex items-center gap-3">
                        <i data-lucide="pen-tool" class="text-red-500"></i> 尺寸快速登記
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">選擇員工姓名</label>
                            <select id="employee-select" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-5 py-4 focus:border-red-500 outline-none transition-all font-bold appearance-none"></select>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">選擇服裝尺寸</label>
                            <div class="flex flex-wrap gap-2">
                                <label class="flex-1 min-w-[60px]">
                                    <input type="radio" name="size" value="S" class="hidden peer">
                                    <div class="text-center py-4 rounded-2xl bg-slate-50 border-2 border-slate-100 font-black peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 transition-all cursor-pointer">S</div>
                                </label>
                                <label class="flex-1 min-w-[60px]">
                                    <input type="radio" name="size" value="M" class="hidden peer">
                                    <div class="text-center py-4 rounded-2xl bg-slate-50 border-2 border-slate-100 font-black peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 transition-all cursor-pointer">M</div>
                                </label>
                                <label class="flex-1 min-w-[60px]">
                                    <input type="radio" name="size" value="L" class="hidden peer" checked>
                                    <div class="text-center py-4 rounded-2xl bg-slate-50 border-2 border-slate-100 font-black peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 transition-all cursor-pointer">L</div>
                                </label>
                                <label class="flex-1 min-w-[60px]">
                                    <input type="radio" name="size" value="XL" class="hidden peer">
                                    <div class="text-center py-4 rounded-2xl bg-slate-50 border-2 border-slate-100 font-black peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 transition-all cursor-pointer">XL</div>
                                </label>
                                <label class="flex-1 min-w-[60px]">
                                    <input type="radio" name="size" value="2XL" class="hidden peer">
                                    <div class="text-center py-4 rounded-2xl bg-slate-50 border-2 border-slate-100 font-black peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 transition-all cursor-pointer">2XL</div>
                                </label>
                            </div>
                        </div>
                    </div>
                    <button onclick="submitSize()" class="w-full mt-8 bg-slate-900 text-white font-black py-5 rounded-[24px] hover:bg-black transition-all shadow-xl shadow-slate-200 flex items-center justify-center gap-3 active:scale-[0.98]">
                        <i data-lucide="check" class="w-6 h-6"></i> 確認登記尺寸
                    </button>
                </div>

                <div class="bg-white rounded-[32px] border border-slate-200 overflow-hidden shadow-sm">
                    <div class="px-8 py-6 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
                        <h3 class="font-black text-slate-800">最新登記紀錄</h3>
                        <button onclick="exportResults()" class="text-xs font-bold text-red-600 bg-white px-4 py-2 rounded-xl border border-red-100 hover:bg-red-50 transition-all">匯出總表</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-50">
                                    <th class="px-8 py-4">單位</th>
                                    <th class="px-8 py-4">姓名</th>
                                    <th class="px-8 py-4">尺寸</th>
                                    <th class="px-8 py-4 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="recent-list" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="tab-stats" class="tab-content hide max-w-6xl mx-auto space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="stats-summary"></div>
                <div class="bg-white p-8 rounded-[32px] border border-slate-200 shadow-sm">
                    <h3 class="font-black text-slate-800 mb-6">各單位統計明細</h3>
                    <div id="dept-stats" class="space-y-4"></div>
                </div>
            </section>

            <section id="tab-manage" class="tab-content hide max-w-4xl mx-auto space-y-6">
                <div class="bg-red-600 p-8 rounded-[40px] text-white flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden shadow-2xl shadow-red-100">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full -mr-16 -mt-16"></div>
                    <div class="relative z-10">
                        <h3 class="text-xl font-black mb-2 flex items-center gap-2"><i data-lucide="file-up"></i> 批量匯入名單</h3>
                        <p class="text-red-100 text-sm font-medium opacity-90">請下載範本填寫員工姓名與單位後上傳。</p>
                    </div>
                    <div class="flex gap-3 relative z-10">
                        <button onclick="downloadTemplate()" class="bg-white text-red-600 px-6 py-3 rounded-2xl font-black hover:bg-red-50 transition-all flex items-center gap-2 shadow-sm">
                            <i data-lucide="download" class="w-4 h-4"></i> 範本下載
                        </button>
                        <label class="bg-red-800 text-white px-6 py-3 rounded-2xl font-black hover:bg-red-900 transition-all cursor-pointer flex items-center gap-2 shadow-sm border border-red-700">
                            <i data-lucide="upload" class="w-4 h-4"></i> 上傳名單
                            <input type="file" id="upload-excel" class="hidden" accept=".xlsx, .xls" onchange="handleExcel(this)">
                        </label>
                    </div>
                </div>

                <div class="bg-white rounded-[32px] border border-slate-200 shadow-sm overflow-hidden">
                    <div class="px-8 py-6 border-b border-slate-50 flex justify-between items-center">
                        <h3 class="font-black text-slate-800 flex items-center gap-2">
                            <i data-lucide="users" class="w-5 h-5 text-slate-400"></i>
                            員工名單管理 (<span id="emp-count">0</span>)
                        </h3>
                    </div>
                    <div class="overflow-x-auto max-h-[500px] overflow-y-auto custom-scrollbar">
                        <table class="w-full text-left">
                            <thead class="sticky top-0 bg-white/95 backdrop-blur-sm z-10 border-b border-slate-50">
                                <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                    <th class="px-8 py-4 text-slate-400">單位</th>
                                    <th class="px-8 py-4">姓名</th>
                                    <th class="px-8 py-4 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="manage-list" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="modal-backdrop" class="hide fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[32px] shadow-2xl overflow-hidden scale-90 transition-transform duration-300" id="modal-content">
            <div class="p-8 text-center">
                <div id="modal-icon-bg" class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i id="modal-icon" data-lucide="alert-triangle" class="w-10 h-10 text-red-500"></i>
                </div>
                <h3 id="modal-title" class="text-xl font-black text-slate-800 mb-2">確認視窗</h3>
                <p id="modal-msg" class="text-slate-500 text-sm font-medium leading-relaxed"></p>
            </div>
            <div class="flex border-t border-slate-50">
                <button id="modal-cancel" class="flex-1 py-5 text-sm font-black text-slate-400 hover:bg-slate-50 transition-all border-r border-slate-50">取消</button>
                <button id="modal-confirm" class="flex-1 py-5 text-sm font-black text-red-500 hover:bg-red-50 transition-all">確定</button>
            </div>
        </div>
    </div>

    <div id="toast" class="hide fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl z-[100] flex items-center gap-3 animate-bounce">
        <i data-lucide="check-circle" class="text-emerald-400 w-5 h-5"></i>
        <span id="toast-msg" class="text-sm font-bold tracking-tight"></span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyD4xB2mpR2pUZBMjyTFjX4NVoZw1unotlE",
            authDomain: "ghgtl-5f69d.firebaseapp.com",
            projectId: "ghgtl-5f69d",
            storageBucket: "ghgtl-5f69d.firebasestorage.app",
            messagingSenderId: "528274392886",
            appId: "1:528274392886:web:6c6475a0621f497a26d597",
            measurementId: "G-W22Y07F9LJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 全域變數
        let employees = [];
        let isMobileMenuOpen = false;

        // 初始化
        window.onload = async () => {
            lucide.createIcons();
            try {
                await signInAnonymously(auth);
                // 實時監聽 Firestore 資料
                onSnapshot(collection(db, "clothing_size_data"), (snapshot) => {
                    employees = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderAll();
                });
            } catch (err) {
                console.error("Firebase 連線失敗:", err);
                showToast("雲端連線失敗，請檢查網路。");
            }
        };

        // --- 功能函數 ---

        window.switchTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hide'));
            document.getElementById(`tab-${tabId}`).classList.remove('hide');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('bg-red-50', 'text-red-600'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.add('text-slate-500', 'hover:bg-slate-50'));
            const activeNav = document.getElementById(`nav-${tabId}`);
            activeNav.classList.remove('text-slate-500', 'hover:bg-slate-50');
            activeNav.classList.add('bg-red-50', 'text-red-600');
            if (isMobileMenuOpen) toggleMobileMenu();
            renderAll();
        };

        window.toggleMobileMenu = () => {
            isMobileMenuOpen = !isMobileMenuOpen;
            document.getElementById('sidebar').style.transform = isMobileMenuOpen ? 'translateX(0)' : 'translateX(-100%)';
            document.getElementById('menu-icon').setAttribute('data-lucide', isMobileMenuOpen ? 'x' : 'menu');
            lucide.createIcons();
        };

        function renderAll() {
            renderEmployeeSelect();
            renderRecentList();
            renderManageList();
            renderStats();
            document.getElementById('emp-count').innerText = employees.length;
        }

        function renderEmployeeSelect() {
            const select = document.getElementById('employee-select');
            const unrecorded = employees.filter(e => !e.size).sort((a, b) => a.unit.localeCompare(b.unit));
            select.innerHTML = unrecorded.length 
                ? unrecorded.map(e => `<option value="${e.id}">${e.unit} - ${e.name}</option>`).join('')
                : '<option disabled>所有員工皆已登記</option>';
        }

        window.submitSize = async () => {
            const id = document.getElementById('employee-select').value;
            const size = document.querySelector('input[name="size"]:checked')?.value;
            if (!id || !size) return showToast("請選擇員工與尺寸");
            
            const emp = employees.find(e => e.id === id);
            await setDoc(doc(db, "clothing_size_data", id), { ...emp, size, timestamp: Date.now() });
            showToast(`已成功登記 ${emp.name} 的尺寸: ${size}`);
        };

        function renderRecentList() {
            const recorded = employees.filter(e => e.size).sort((a, b) => b.timestamp - a.timestamp);
            const html = recorded.map(e => `
                <tr class="hover:bg-slate-50/50 transition-colors">
                    <td class="px-8 py-5 text-xs font-bold text-slate-400">${e.unit}</td>
                    <td class="px-8 py-5 text-sm font-black text-slate-800">${e.name}</td>
                    <td class="px-8 py-5 text-sm font-black text-red-600">${e.size}</td>
                    <td class="px-8 py-5 text-right">
                        <button onclick="clearRecord('${e.id}')" class="p-2 rounded-xl text-slate-300 hover:text-red-500 hover:bg-red-50 transition-all">
                            <i data-lucide="x-circle" class="w-5 h-5"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
            document.getElementById('recent-list').innerHTML = html || '<tr><td colspan="4" class="px-8 py-10 text-center text-slate-400 font-bold">目前尚無登記紀錄</td></tr>';
            lucide.createIcons();
        }

        window.clearRecord = (id) => {
            const emp = employees.find(e => e.id === id);
            showConfirmModal('撤銷登記', `確定要撤銷 ${emp.name} 的尺寸登記嗎？`, '撤銷', 'bg-red-600', 'bg-red-50', async () => {
                await setDoc(doc(db, "clothing_size_data", id), { ...emp, size: null, timestamp: null });
                showToast("已撤銷登記");
            });
        };

        function renderManageList() {
            const html = employees.sort((a, b) => a.unit.localeCompare(b.unit)).map(e => `
                <tr class="hover:bg-slate-50/50 transition-colors">
                    <td class="px-8 py-5 text-xs font-bold text-slate-400">${e.unit}</td>
                    <td class="px-8 py-5 text-sm font-black text-slate-800">${e.name}</td>
                    <td class="px-8 py-5 text-right">
                        <button onclick="removeEmployee('${e.id}')" class="p-2 rounded-xl text-slate-300 hover:text-red-500 hover:bg-red-50 transition-all">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
            document.getElementById('manage-list').innerHTML = html || '<tr><td colspan="3" class="px-8 py-10 text-center text-slate-400 font-bold">名單為空，請匯入 Excel</td></tr>';
            lucide.createIcons();
        }

        window.removeEmployee = (id) => {
            const emp = employees.find(e => e.id === id);
            showConfirmModal('刪除員工', `確定要將 ${emp.name} 從名單中移除嗎？`, '刪除', 'bg-red-600', 'bg-red-50', async () => {
                await deleteDoc(doc(db, "clothing_size_data", id));
                showToast("已刪除員工");
            });
        };

        function renderStats() {
            const recorded = employees.filter(e => e.size);
            const sizes = ['S', 'M', 'L', 'XL', '2XL'];
            
            // 總計
            const summaryHtml = sizes.map(s => {
                const count = recorded.filter(e => e.size === s).length;
                return `
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">${s} 總計</p>
                        <p class="text-3xl font-black text-slate-800 leading-none">${count}<span class="text-xs ml-1 text-slate-400">件</span></p>
                    </div>
                `;
            }).join('') + `
                <div class="bg-slate-900 p-6 rounded-3xl shadow-xl shadow-slate-200 text-white">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">登記進度</p>
                    <p class="text-3xl font-black leading-none">${recorded.length}<span class="text-xs ml-1 opacity-50">/ ${employees.length}</span></p>
                </div>
            `;
            document.getElementById('stats-summary').innerHTML = summaryHtml;

            // 單位明細
            const depts = [...new Set(employees.map(e => e.unit))];
            const deptHtml = depts.map(d => {
                const deptEmps = employees.filter(e => e.unit === d);
                return `
                    <div class="flex items-center gap-4 p-4 rounded-2xl bg-slate-50/50 border border-slate-100">
                        <div class="w-24 text-sm font-black text-slate-800 truncate">${d}</div>
                        <div class="flex-1 flex gap-2">
                            ${sizes.map(s => {
                                const count = deptEmps.filter(e => e.size === s).length;
                                return `<div class="flex-1 text-center bg-white rounded-xl py-2 shadow-sm"><p class="text-[8px] font-black text-slate-300">${s}</p><p class="text-sm font-black text-slate-700">${count}</p></div>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('dept-stats').innerHTML = deptHtml || '<p class="text-center text-slate-400 font-bold">尚無統計數據</p>';
        }

        window.handleExcel = (input) => {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const workbook = XLSX.read(e.target.result, { type: 'binary' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(sheet);
                
                const batch = writeBatch(db);
                data.forEach(row => {
                    if (row.單位 && row.姓名) {
                        const id = crypto.randomUUID();
                        const ref = doc(db, "clothing_size_data", id);
                        batch.set(ref, { unit: row.單位, name: row.姓名, size: null, timestamp: null });
                    }
                });
                await batch.commit();
                showToast(`成功匯入 ${data.length} 位員工`);
            };
            reader.readAsBinaryString(file);
            input.value = "";
        };

        window.goHomeAndClear = () => {
            showConfirmModal('重新開始', '確定要清空雲端所有名單與已登記的尺寸嗎？此操作不可逆。', '確定清空', 'bg-red-600', 'bg-red-50', async () => {
                const batch = writeBatch(db);
                employees.forEach(e => batch.delete(doc(db, "clothing_size_data", e.id)));
                await batch.commit();
                showToast("資料已全面清空");
            });
        };

        window.downloadTemplate = () => {
            const ws = XLSX.utils.aoa_to_sheet([['單位', '姓名'], ['人力資源部', '王大明'], ['資訊部', '李小美']]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "員工清單範例");
            XLSX.writeFile(wb, "員工服裝尺寸登記模板.xlsx");
        };

        window.exportResults = () => {
            const data = [['單位', '姓名', '服裝尺寸'], ...employees.map(e => [e.unit, e.name, e.size || '未登記'])];
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "尺寸登記統計總表");
            XLSX.writeFile(wb, "員工服裝尺寸登記總表.xlsx");
        };

        // UI 視覺回饋
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hide');
            setTimeout(() => toast.classList.add('hide'), 3000);
        }

        function showConfirmModal(title, msg, btnText, btnClass, iconBg, onConfirm) {
            const backdrop = document.getElementById('modal-backdrop');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal-confirm').innerText = btnText;
            document.getElementById('modal-confirm').className = `flex-1 py-5 text-sm font-black text-white ${btnClass} transition-all`;
            document.getElementById('modal-icon-bg').className = `w-20 h-20 ${iconBg} rounded-full flex items-center justify-center mx-auto mb-6`;
            backdrop.classList.remove('hide');
            
            const confirmBtn = document.getElementById('modal-confirm');
            const cancelBtn = document.getElementById('modal-cancel');
            
            const close = () => backdrop.classList.add('hide');
            confirmBtn.onclick = () => { onConfirm(); close(); };
            cancelBtn.onclick = close;
        }
    </script>
</body>
</html>
