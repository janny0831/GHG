<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工服裝尺寸登記系統 - 雲端版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .hide { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .btn-icon-hover:hover { background-color: #fee2e2; color: #ef4444; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex overflow-hidden">

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl lg:shadow-none">
        <div class="flex flex-col h-full p-6">
            <div class="flex items-center gap-3 mb-10 px-2">
                <div class="bg-red-600 p-2.5 rounded-2xl shadow-lg shadow-red-100">
                    <i data-lucide="shirt" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-slate-800 tracking-tight">服裝登記</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Cloud Database v2.0</p>
                </div>
            </div>

            <nav class="flex-1 space-y-2">
                <button onclick="switchPage('upload')" id="nav-upload" class="nav-btn w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-sm font-bold transition-all bg-red-600 text-white shadow-lg shadow-red-100">
                    <i data-lucide="file-up" class="w-5 h-5"></i> <span>名單匯入</span>
                </button>
                <button onclick="switchPage('register')" id="nav-register" class="nav-btn w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-sm font-bold transition-all text-slate-500 hover:bg-slate-50">
                    <i data-lucide="user-plus" class="w-5 h-5"></i> <span>尺寸登記</span>
                </button>
                <button onclick="switchPage('summary')" id="nav-summary" class="nav-btn w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-sm font-bold transition-all text-slate-500 hover:bg-slate-50">
                    <i data-lucide="pie-chart" class="w-5 h-5"></i> <span>統計分析</span>
                </button>
            </nav>

            <div class="mt-auto space-y-3">
                <button onclick="goHomeAndClear()" class="w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-sm font-bold text-red-500 hover:bg-red-50 transition-all">
                    <i data-lucide="refresh-ccw" class="w-5 h-5"></i> <span>清空重置</span>
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 lg:ml-72 h-screen overflow-hidden relative">
        <header class="h-20 bg-white border-b border-slate-200 px-8 flex items-center justify-between shrink-0">
            <button onclick="toggleMobileMenu()" class="lg:hidden p-2 text-slate-500">
                <i id="menu-icon" data-lucide="menu"></i>
            </button>
            <div id="page-title" class="text-lg font-black text-slate-800">名單匯入</div>
            <div class="flex items-center gap-4">
                <div class="hidden md:flex flex-col items-end">
                    <span id="cloud-status" class="text-[10px] font-black text-emerald-500 uppercase flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> 雲端連線中
                    </span>
                    <span id="stat-count" class="text-xs font-bold text-slate-400 italic">已載入 0 位員工</span>
                </div>
            </div>
        </header>

        <section id="page-upload" class="page-content flex-1 overflow-y-auto p-8">
            <div class="max-w-4xl mx-auto">
                <div class="bg-white rounded-[40px] border border-slate-200 p-12 text-center shadow-sm">
                    <div class="w-20 h-20 bg-red-50 text-red-600 rounded-3xl flex items-center justify-center mx-auto mb-6">
                        <i data-lucide="database" class="w-10 h-10"></i>
                    </div>
                    <h2 class="text-3xl font-black text-slate-800 mb-4">開始登記流程</h2>
                    <p class="text-slate-500 mb-10 text-lg">請上傳 Excel 名單，系統將同步至雲端以供多人同時登記。</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <button onclick="downloadTemplate()" class="flex items-center justify-center gap-3 bg-slate-100 text-slate-700 font-bold py-5 px-8 rounded-3xl hover:bg-slate-200 transition-all active:scale-95">
                            <i data-lucide="download" class="w-5 h-5"></i> 下載 Excel 範本
                        </button>
                        <label class="flex items-center justify-center gap-3 bg-red-600 text-white font-bold py-5 px-8 rounded-3xl hover:bg-red-700 transition-all cursor-pointer shadow-lg shadow-red-100 active:scale-95">
                            <i data-lucide="file-up" class="w-5 h-5"></i> 上傳員工名單
                            <input type="file" class="hidden" accept=".xlsx, .xls" onchange="handleFileUpload(event)">
                        </label>
                    </div>
                </div>
            </div>
        </section>

        <section id="page-register" class="page-content hide flex-1 overflow-hidden p-8 flex flex-col">
            <div class="flex items-center gap-4 mb-6 shrink-0">
                <div class="flex-1 relative">
                    <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                    <input type="text" id="search-input" oninput="renderRegisterList()" placeholder="輸入姓名或單位搜尋..." class="w-full bg-white border border-slate-200 rounded-2xl py-4 pl-14 pr-6 font-bold focus:outline-none focus:ring-2 focus:ring-red-500/20 transition-all shadow-sm">
                </div>
            </div>

            <div class="flex-1 bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                <div class="overflow-y-auto custom-scrollbar flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-slate-50 text-slate-400 text-[10px] font-black uppercase tracking-widest z-10">
                            <tr>
                                <th class="px-8 py-5 border-b border-slate-100">單位</th>
                                <th class="px-8 py-5 border-b border-slate-100">姓名</th>
                                <th class="px-8 py-5 border-b border-slate-100">服裝尺寸</th>
                            </tr>
                        </thead>
                        <tbody id="register-list" class="divide-y divide-slate-50">
                            </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="page-summary" class="page-content hide flex-1 overflow-y-auto p-8">
            <div class="max-w-5xl mx-auto space-y-6">
                <div class="flex justify-between items-end">
                    <h2 class="text-2xl font-black text-slate-800">登記結果統計</h2>
                    <button onclick="exportResults()" class="flex items-center gap-2 bg-emerald-600 text-white px-6 py-3 rounded-2xl font-bold hover:bg-emerald-700 transition-all shadow-lg shadow-emerald-100">
                        <i data-lucide="file-spreadsheet" class="w-5 h-5"></i> 匯出最終結果
                    </button>
                </div>
                <div id="summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
                <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-sm">
                    <h3 class="font-black text-slate-800 mb-6">各單位登記進度</h3>
                    <div id="unit-progress" class="space-y-6"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hide flex items-center justify-center p-6">
        <div id="modal-content" class="bg-white rounded-[40px] max-w-md w-full p-10 shadow-2xl transform transition-all duration-300 scale-95 opacity-0"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, writeBatch, query, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

        // 使用您提供的 API 配置
        const firebaseConfig = {
            apiKey: "AIzaSyD4xB2mpR2pUZBMjyTFjX4NVoZw1unotlE",
            authDomain: "ghgtl-5f69d.firebaseapp.com",
            projectId: "ghgtl-5f69d",
            storageBucket: "ghgtl-5f69d.firebasestorage.app",
            messagingSenderId: "528274392886",
            appId: "1:528274392886:web:6c6475a0621f497a26d597",
            measurementId: "G-W22Y07F9LJ"
        };

        // 初始化
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let employees = [];
        let isMobileMenuOpen = false;
        const SIZES = ['S', 'M', 'L', 'XL', '2XL', '3XL', '5XL'];

        // 匿名登入以確保可以讀寫數據
        signInAnonymously(auth).then(() => {
            console.log("Firebase 雲端已連線");
            listenToData(); // 開始監聽數據
        });

        // 實時監聽資料庫
        function listenToData() {
            onSnapshot(collection(db, "employees"), (snapshot) => {
                employees = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateGlobalStats();
                const activePage = document.querySelector('.page-content:not(.hide)').id.replace('page-', '');
                refreshPage(activePage);
            });
        }

        // 頁面刷新邏輯
        function refreshPage(pageId) {
            if (pageId === 'register') renderRegisterList();
            if (pageId === 'summary') renderSummary();
        }

        // 更新數據至雲端
        async function updateEmployeeSize(id, size) {
            const empRef = doc(db, "employees", id);
            await setDoc(empRef, { size: size }, { merge: true });
        }

        // 切換頁面
        window.switchPage = function(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hide'));
            document.getElementById(`page-${pageId}`).classList.remove('hide');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('bg-red-600', 'text-white', 'shadow-lg', 'shadow-red-100'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.add('text-slate-500', 'hover:bg-slate-50'));
            
            const activeBtn = document.getElementById(`nav-${pageId}`);
            activeBtn.classList.remove('text-slate-500', 'hover:bg-slate-50');
            activeBtn.classList.add('bg-red-600', 'text-white', 'shadow-lg', 'shadow-red-100');

            const titles = { upload: '名單匯入', register: '尺寸登記', summary: '統計分析' };
            document.getElementById('page-title').innerText = titles[pageId];

            if (pageId === 'register') renderRegisterList();
            if (pageId === 'summary') renderSummary();
            if (isMobileMenuOpen) toggleMobileMenu();
        };

        // 檔案處理：批次上傳至 Firebase
        window.handleFileUpload = function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                
                const validData = rawData.filter(item => item['單位'] && item['姓名']).map(item => ({
                    unit: String(item['單位']).trim(),
                    name: String(item['姓名']).trim(),
                    size: ''
                }));

                if (validData.length > 0) {
                    showConfirmModal('匯入名單', `偵測到 ${validData.length} 位員工，是否確定匯入雲端？`, '開始匯入', 'bg-red-600 text-white', 'bg-slate-100', async () => {
                        const batch = writeBatch(db);
                        validData.forEach(emp => {
                            // 使用 單位+姓名 作為 ID 避免重複
                            const id = `${emp.unit}_${emp.name}`;
                            const ref = doc(db, "employees", id);
                            batch.set(ref, emp);
                        });
                        await batch.commit();
                        switchPage('register');
                    });
                }
            };
            reader.readAsArrayBuffer(file);
        };

        // 渲染列表
        window.renderRegisterList = function() {
            const container = document.getElementById('register-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            
            const filtered = employees.filter(e => e.name.toLowerCase().includes(search) || e.unit.toLowerCase().includes(search));
            
            container.innerHTML = filtered.map(e => `
                <tr class="hover:bg-slate-50/50 transition-all">
                    <td class="px-8 py-5 text-slate-500 font-medium text-sm">${e.unit}</td>
                    <td class="px-8 py-5 text-slate-800 font-black">${e.name}</td>
                    <td class="px-8 py-5">
                        <div class="flex flex-wrap gap-2">
                            ${SIZES.map(s => `
                                <button onclick="selectSize('${e.id}', '${s}')" class="px-4 py-2 rounded-xl text-xs font-black transition-all ${e.size === s ? 'bg-red-600 text-white shadow-md' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}">
                                    ${s}
                                </button>
                            `).join('')}
                        </div>
                    </td>
                </tr>
            `).join('');
            if (filtered.length === 0) container.innerHTML = `<tr><td colspan="3" class="px-8 py-20 text-center text-slate-400 font-bold">找不到相關員工資料</td></tr>`;
        };

        window.selectSize = function(id, size) {
            updateEmployeeSize(id, size);
        };

        // 統計頁面
        window.renderSummary = function() {
            const stats = SIZES.reduce((acc, s) => ({ ...acc, [s]: 0 }), {});
            employees.forEach(e => { if (e.size) stats[e.size]++; });

            document.getElementById('summary-cards').innerHTML = SIZES.map(s => `
                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                    <div class="text-[10px] font-black text-slate-400 uppercase mb-1">${s} 尺寸</div>
                    <div class="text-2xl font-black text-slate-800">${stats[s]} <span class="text-xs text-slate-400 font-bold">件</span></div>
                </div>
            `).join('');

            const units = [...new Set(employees.map(e => e.unit))];
            document.getElementById('unit-progress').innerHTML = units.map(u => {
                const list = employees.filter(e => e.unit === u);
                const done = list.filter(e => e.size).length;
                const percent = Math.round((done / list.length) * 100);
                return `
                    <div class="space-y-2">
                        <div class="flex justify-between items-end">
                            <span class="font-black text-slate-700 text-sm">${u}</span>
                            <span class="text-xs font-bold text-slate-400">${done} / ${list.length} (${percent}%)</span>
                        </div>
                        <div class="h-3 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full bg-red-500 transition-all duration-500" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        // 清空重置 (雲端同步刪除)
        window.goHomeAndClear = function() {
            showConfirmModal('重新開始', '確定要重新開始嗎？這將會清空雲端資料庫所有數據。', '確定清空', 'bg-red-600 text-white shadow-red-200', 'bg-red-50 text-red-500', async () => {
                const batch = writeBatch(db);
                const q = query(collection(db, "employees"));
                const snapshot = await getDocs(q);
                snapshot.forEach(d => batch.delete(d.ref));
                await batch.commit();
                window.location.reload();
            });
        };

        // 通用邏輯保持不變 (Excel 範本, 匯出, 側邊欄, Modal)
        function updateGlobalStats() {
            document.getElementById('stat-count').innerText = `已載入 ${employees.length} 位員工`;
        }

        window.toggleMobileMenu = function() {
            isMobileMenuOpen = !isMobileMenuOpen;
            document.getElementById('sidebar').style.transform = isMobileMenuOpen ? 'translateX(0)' : 'translateX(-100%)';
            document.getElementById('menu-icon').setAttribute('data-lucide', isMobileMenuOpen ? 'x' : 'menu');
            lucide.createIcons();
        };

        window.downloadTemplate = function() {
            const ws = XLSX.utils.aoa_to_sheet([['單位', '姓名'], ['人力資源部', '王大明'], ['資訊部', '李小美']]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "員工清單範例");
            XLSX.writeFile(wb, "員工服裝尺寸登記模板.xlsx");
        };

        window.exportResults = function() {
            const data = [['單位', '姓名', '服裝尺寸'], ...employees.map(e => [e.unit, e.name, e.size || '尚未登記'])];
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "最終登記結果");
            XLSX.writeFile(wb, `員工服裝尺寸登記結果_${new Date().toLocaleDateString()}.xlsx`);
        };

        window.showConfirmModal = function(title, msg, btnText, btnClass, cancelClass, onConfirm) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <h3 class="text-2xl font-black text-slate-800 mb-4">${title}</h3>
                <p class="text-slate-500 mb-8 font-medium">${msg}</p>
                <div class="flex flex-col gap-3">
                    <button id="modal-confirm" class="w-full py-4 rounded-2xl font-black transition-all ${btnClass}">${btnText}</button>
                    <button onclick="closeModal()" class="w-full py-4 rounded-2xl font-black transition-all ${cancelClass}">取消</button>
                </div>
            `;
            overlay.classList.remove('hide');
            setTimeout(() => { content.classList.add('scale-100', 'opacity-100'); }, 10);
            document.getElementById('modal-confirm').onclick = () => { onConfirm(); closeModal(); };
        };

        window.closeModal = function() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            setTimeout(() => { overlay.classList.add('hide'); }, 300);
        };

        lucide.createIcons();
    </script>
</body>
</html>
